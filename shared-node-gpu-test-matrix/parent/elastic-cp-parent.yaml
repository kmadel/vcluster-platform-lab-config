# The elastic parent: a Private Nodes cluster with KubeVirt Auto Nodes that is also
# connected to Platform as a control plane cluster. Shared-node clusters in the
# gpu-test-matrix project run on it, and each one gets its own GPU VM from the
# single "tenant" pool below. Nothing here changes when a cluster is added.
#
# Connecting it as a control plane cluster is a one-time CLI step after this syncs
# (see ../README.md). Until then the tenant clusters wait for elastic-cp-parent.
apiVersion: management.loft.sh/v1
kind: VirtualClusterInstance
metadata:
  name: elastic-cp-parent
  namespace: p-platform
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  displayName: elastic-cp-parent
  description: Elastic control plane cluster for the shared-node GPU test matrix.
  owner:
    user: admin
  clusterRef:
    cluster: spark-cluster
    namespace: p-platform-v-elastic-cp-parent
  template:
    metadata: {}
    pro:
      enabled: true
    helmRelease:
      chart:
        name: vcluster
        version: 0.37.3
      values: |
        privateNodes:
          enabled: true
          vpn:
            enabled: true
          autoNodes:
            - provider: kubevirt-us-va-blacksburg-dc1
              dynamic:
                # Untainted: the parent's own system pods and every shared-node
                # control plane land here.
                - name: system
                  nodeTypeSelector:
                    - property: vcluster.com/node-type
                      value: kvm-medium
                    # Required. The Auto Nodes cloud provider registers every NodeType
                    # property key as a well-known label, and Karpenter lets a pool
                    # serve a pod that asks for a well-known label the pool doesn't
                    # mention. Without this, a pending tenant pod can land here and
                    # stamp its tenant label on a plain CPU node.
                    - property: demo.vcluster.com/tenant
                      operator: DoesNotExist
                  limits:
                    cpu: "4"
                # One node per tenant cluster. Only NodeTypes that declare the tenant
                # key with "*" match (kvm-gb300-1gpu-tenant). A shared-node cluster's
                # synced pods carry nodeSelector demo.vcluster.com/tenant=<project>-<name>,
                # so Karpenter's NodeClaim requires that one value and labels the new
                # node with it.
                - name: tenant
                  nodeTypeSelector:
                    - property: demo.vcluster.com/tenant
                      operator: Exists
                  taints:
                    - key: demo.vcluster.com/tenant-pool
                      value: "true"
                      effect: NoSchedule
                  limits:
                    # Four 2-CPU GPU VMs: the GB300 tray's 4 simulated GPUs.
                    cpu: "8"
                  disruption:
                    # A sleeping or deleted cluster empties its node; the VM goes back
                    # to the tray and the next one boots clean.
                    consolidationPolicy: WhenEmpty
                    consolidateAfter: 2m
        # KubeVirt NodeTypes use bridge binding on the provider cluster's pod network
        # (10.64.0.0/16), so these must not overlap the provider's pod or service CIDRs.
        networking:
          podCIDR: 10.244.0.0/16
          serviceCIDR: 10.96.0.0/16
        controlPlane:
          backingStore:
            etcd:
              embedded:
                enabled: true
          statefulSet:
            scheduling:
              nodeSelector:
                kubernetes.io/hostname: vmetal-w02
        # fleet-bindings attaches cluster-collector-with-embedded-etcd to every
        # private-node cluster, but its Argo CD binding stays InvalidConnector until
        # this is set. ../parent/parent-dcgm-collector.yaml rides the same connector.
        integrations:
          argoCD:
            enabled: true
            connector: demo-lab
        # Shared platform pieces the parent provides once for every cluster on it.
        # Operand pods synced from a cluster's GPU Operator ask for runtimeClassName
        # nvidia, and RuntimeClasses are not synced down from those clusters, so the
        # API server here would reject the pods without this one. The "nvidia"
        # handler is the runtime nvml-mock's node agent (installed by each cluster's
        # Stack) adds to containerd; with real GPUs, the GPU Operator's toolkit does.
        experimental:
          deploy:
            vcluster:
              manifests: |-
                apiVersion: node.k8s.io/v1
                kind: RuntimeClass
                metadata:
                  name: nvidia
                handler: nvidia
                # tenant-pool-isolation: the tenant pool's taint keeps out pods without a tenant
                # selector, but any pod can tolerate it, by key or with a wildcard. This keeps a
                # synced pod that gets past the taint on its own cluster's nodes: its
                # demo.vcluster.com/tenant selector must equal <project>-<name> from its host
                # namespace (p-<project>-v-<name>). Fails closed for any other namespace naming.
                ---
                apiVersion: admissionregistration.k8s.io/v1
                kind: ValidatingAdmissionPolicy
                metadata:
                  name: tenant-pool-isolation
                spec:
                  failurePolicy: Fail
                  matchConstraints:
                    resourceRules:
                      - apiGroups: [""]
                        apiVersions: ["v1"]
                        operations: ["CREATE"]
                        resources: ["pods"]
                  matchConditions:
                    # Only pods synced from a shared-node cluster. The parent's own pods (flannel,
                    # kube-proxy, collectors) also tolerate everything and belong on tenant nodes.
                    - name: synced-from-a-cluster
                      expression: >-
                        has(object.metadata.labels) &&
                        'vcluster.loft.sh/managed-by' in object.metadata.labels
                    # ...that can get past the tenant pool's taint, by its key or with a wildcard.
                    - name: tolerates-tenant-pool
                      expression: >-
                        has(object.spec.tolerations) && object.spec.tolerations.exists(t,
                          (has(t.key) && t.key == 'demo.vcluster.com/tenant-pool') ||
                          ((!has(t.key) || t.key == '') && has(t.operator) && t.operator == 'Exists'))
                  variables:
                    - name: cluster
                      expression: "object.metadata.labels['vcluster.loft.sh/managed-by']"
                    # Host namespaces follow p-<project>-v-<name>; the tenant value is <project>-<name>.
                    # Anything else yields '' and is denied.
                    - name: expected
                      expression: >-
                        request.namespace.startsWith('p-') && request.namespace.endsWith('-v-' + variables.cluster)
                          ? request.namespace.substring(2, size(request.namespace) - size(variables.cluster) - 3) + '-' + variables.cluster
                          : ''
                  validations:
                    - expression: >-
                        variables.expected != '' &&
                        has(object.spec.nodeSelector) &&
                        'demo.vcluster.com/tenant' in object.spec.nodeSelector &&
                        object.spec.nodeSelector['demo.vcluster.com/tenant'] == variables.expected
                      messageExpression: >-
                        'pod from cluster ' + variables.cluster + ' in ' + request.namespace +
                        ' tolerates the tenant pool but does not select its own tenant nodes (demo.vcluster.com/tenant=' +
                        (variables.expected == '' ? '<unknown: namespace is not p-<project>-v-<name>>' : variables.expected) + ')'
                ---
                apiVersion: admissionregistration.k8s.io/v1
                kind: ValidatingAdmissionPolicyBinding
                metadata:
                  name: tenant-pool-isolation
                spec:
                  policyName: tenant-pool-isolation
                  validationActions: ["Deny"]
                ---
                # tenant-node-reaper: releases a tenant node a few minutes after only DaemonSet pods are
                # left on it. Karpenter can't, because a cluster's DaemonSet pods run here
                # as copies vCluster owns by the cluster's Service, so to Karpenter the node
                # never looks empty (see the README's "Scaling in"). Deleting the Node
                # object is enough: Karpenter's termination finalizer drains it and deletes
                # its NodeClaim, and the VM goes back to the tray.
                ---
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: tenant-node-reaper
                ---
                apiVersion: v1
                kind: ServiceAccount
                metadata:
                  name: tenant-node-reaper
                  namespace: tenant-node-reaper
                ---
                apiVersion: rbac.authorization.k8s.io/v1
                kind: ClusterRole
                metadata:
                  name: tenant-node-reaper
                rules:
                  - apiGroups: [""]
                    resources: ["nodes"]
                    verbs: ["get", "list", "patch", "delete"]
                  - apiGroups: [""]
                    resources: ["pods"]
                    verbs: ["list"]
                  # Read-only: the parent's API server refuses writes to karpenter.sh.
                  - apiGroups: ["karpenter.sh"]
                    resources: ["nodeclaims"]
                    verbs: ["get", "list"]
                ---
                apiVersion: rbac.authorization.k8s.io/v1
                kind: ClusterRoleBinding
                metadata:
                  name: tenant-node-reaper
                roleRef:
                  apiGroup: rbac.authorization.k8s.io
                  kind: ClusterRole
                  name: tenant-node-reaper
                subjects:
                  - kind: ServiceAccount
                    name: tenant-node-reaper
                    namespace: tenant-node-reaper
                ---
                apiVersion: v1
                kind: ConfigMap
                metadata:
                  name: tenant-node-reaper
                  namespace: tenant-node-reaper
                data:
                  reap.sh: |
                    #!/bin/bash
                    # Deletes a tenant node once it only runs DaemonSet pods: this cluster's own
                    # (owned by a DaemonSet) and synced copies of a tenant cluster's, which
                    # vCluster marks with vcluster.loft.sh/owner-set-kind: DaemonSet.
                    #
                    # A new node also starts out with only DaemonSet pods, before the pod that asked
                    # for it schedules. Three guards keep it:
                    #   1. Karpenter hasn't initialized it yet. Initialized means its extended
                    #      resources (the GPU) are registered, which is when a waiting GPU pod can
                    #      bind; INIT_GRACE_SECONDS more covers the bind itself.
                    #   2. A Pending pod in this cluster asks for the node's tenant label.
                    #   3. It must be idle on two runs at least IDLE_SECONDS apart, which also rides
                    #      out a rolling restart.
                    set -euo pipefail
                    IDLE_SECONDS="${IDLE_SECONDS:-120}"
                    INIT_GRACE_SECONDS="${INIT_GRACE_SECONDS:-120}"
                    MARK=demo.vcluster.com/idle-since
                    now=$(date +%s)

                    # Node name -> when Karpenter initialized it (epoch seconds).
                    initialized=$(kubectl get nodeclaims.karpenter.sh -o json | jq -c '
                      [.items[] | select(.status.nodeName != null)
                       | {(.status.nodeName): ([.status.conditions[]? | select(.type == "Initialized" and .status == "True")
                                                | .lastTransitionTime | fromdateiso8601][0] // 0)}] | add // {}')
                    # Tenant values that Pending pods are waiting for.
                    waiting=$(kubectl get pods -A --field-selector status.phase=Pending -o json | jq -c '
                      [.items[] | .spec.nodeSelector["demo.vcluster.com/tenant"] // empty] | unique')

                    kubectl get nodes -l demo.vcluster.com/tenant -o json |
                      jq -r '.items[] | select(.metadata.deletionTimestamp == null)
                        | select((.metadata.annotations["karpenter.sh/do-not-disrupt"] // "") != "true")
                        | "\(.metadata.name) \(.metadata.labels["demo.vcluster.com/tenant"]) \(.metadata.annotations["'"$MARK"'"] // "")"' |
                    while read -r node tenant since; do
                      init=$(jq -r --arg n "$node" '.[$n] // 0' <<<"$initialized")
                      if [ "$init" = "0" ] || [ $(( now - init )) -lt "$INIT_GRACE_SECONDS" ]; then
                        [ -n "$since" ] && kubectl annotate node "$node" "$MARK-" >/dev/null
                        echo "$node: new (not initialized, or initialized under ${INIT_GRACE_SECONDS}s ago), keeping"
                        continue
                      fi
                      if jq -e --arg t "$tenant" 'index($t) != null' <<<"$waiting" >/dev/null; then
                        [ -n "$since" ] && kubectl annotate node "$node" "$MARK-" >/dev/null
                        echo "$node: pods are pending for $tenant, keeping"
                        continue
                      fi
                      busy=$(kubectl get pods -A --field-selector "spec.nodeName=$node" -o json | jq '
                        [.items[] | select(.status.phase != "Succeeded" and .status.phase != "Failed")
                         | select((.metadata.annotations["vcluster.loft.sh/owner-set-kind"] // "") != "DaemonSet")
                         | select([.metadata.ownerReferences[]? | select(.kind == "DaemonSet" or .kind == "Node")] | length == 0)
                        ] | length')
                      if [ "$busy" != "0" ]; then
                        [ -n "$since" ] && kubectl annotate node "$node" "$MARK-" >/dev/null
                        echo "$node: $busy workload pods, keeping"
                      elif [ -z "$since" ]; then
                        kubectl annotate node "$node" "$MARK=$now" >/dev/null
                        echo "$node: only DaemonSet pods, marked idle"
                      elif [ $(( now - since )) -ge "$IDLE_SECONDS" ]; then
                        echo "$node: idle for $(( now - since ))s, deleting"
                        kubectl delete node "$node" --wait=false
                      else
                        echo "$node: idle for $(( now - since ))s, waiting"
                      fi
                    done
                ---
                apiVersion: batch/v1
                kind: CronJob
                metadata:
                  name: tenant-node-reaper
                  namespace: tenant-node-reaper
                spec:
                  schedule: "* * * * *"
                  concurrencyPolicy: Forbid
                  successfulJobsHistoryLimit: 2
                  failedJobsHistoryLimit: 3
                  jobTemplate:
                    spec:
                      backoffLimit: 0
                      template:
                        spec:
                          serviceAccountName: tenant-node-reaper
                          restartPolicy: Never
                          containers:
                            - name: reap
                              image: alpine/k8s:1.34.1
                              command: ["bash", "/scripts/reap.sh"]
                              env:
                                - name: IDLE_SECONDS
                                  value: "120"
                                - name: INIT_GRACE_SECONDS
                                  value: "120"
                              resources:
                                requests:
                                  cpu: 10m
                                  memory: 32Mi
                              volumeMounts:
                                - name: scripts
                                  mountPath: /scripts
                          volumes:
                            - name: scripts
                              configMap:
                                name: tenant-node-reaper
