# The upgrade candidate (newer driver and GPU Operator), qualified next to the
# baseline on identical hardware.
# Instances created outside the UI get no parameter defaults, so the versions are
# always passed explicitly.
apiVersion: management.loft.sh/v1
kind: VirtualClusterInstance
metadata:
  name: gpu-candidate
  namespace: p-gpu-test-matrix
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  displayName: gpu-candidate
  owner:
    user: admin
  clusterRef:
    cluster: elastic-cp-parent
  templateRef:
    name: shared-node-gpu-tenant
  parameters: |
    gpuOperatorVersion: v26.3.3
    driverVersion: 580.82.07
