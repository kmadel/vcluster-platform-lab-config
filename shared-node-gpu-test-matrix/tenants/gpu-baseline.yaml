# The current GPU stack: the driver and GPU Operator versions in production.
# Instances created outside the UI get no parameter defaults, so the versions are
# always passed explicitly.
apiVersion: management.loft.sh/v1
kind: VirtualClusterInstance
metadata:
  name: gpu-baseline
  namespace: p-gpu-test-matrix
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  displayName: gpu-baseline
  owner:
    user: admin
  clusterRef:
    cluster: elastic-cp-parent
  templateRef:
    name: shared-node-gpu-tenant
  parameters: |
    gpuOperatorVersion: v26.3.2
    driverVersion: 580.65.06
