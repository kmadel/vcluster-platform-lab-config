# A shared-node cluster that gets its own GPU node from the elastic parent and runs
# its own simulated driver version and GPU Operator version on it.
#
# The cluster's identity reaches the parent on its pods, not through the parent's
# config: vCluster adds sync.fromHost.nodes.selector.labels as a nodeSelector to
# every pod it syncs, and the parent's "tenant" pool turns that into a node labeled
# for this cluster only.
apiVersion: storage.loft.sh/v1
kind: VirtualClusterTemplate
metadata:
  name: shared-node-gpu-tenant
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  displayName: Shared nodes, own GPU node, driver, and GPU Operator
  description: |
    Shared-node cluster on elastic-cp-parent. Gets a dedicated GB300 tray slot and
    runs the simulated driver version and GPU Operator version you pick on it.
  owner:
    user: admin
  parameters:
    - variable: gpuOperatorVersion
      label: GPU Operator Version
      description: |
        Each cluster runs its own GPU Operator on its own node. The GPUs are
        simulated (nvml-mock), which v26.7.x and later can't run on: its device
        plugin waits for a real nvidia kernel module.
      type: string
      options:
        - v26.3.3
        - v26.3.2
        - v26.3.1
      defaultValue: v26.3.3
    - variable: driverVersion
      label: Simulated Driver Version
      description: |
        The driver version nvml-mock reports on this cluster's node (nvidia-smi,
        NVML, GFD labels). With real GPUs, this would be the driver version the GPU
        Operator installs. Takes effect with nvml-mock 0.6.0 and later; on 0.5.x
        every cluster reports the profile's 580.65.06.
      type: string
      options:
        - 580.65.06
        - 580.82.07
        - 575.57.08
        - 570.172.08
      defaultValue: 580.65.06
  template:
    metadata: {}
    instanceTemplate:
      metadata: {}
    pro: {}
    helmRelease:
      chart:
        version: 0.37.3
      values: |
        controlPlane:
          backingStore:
            etcd:
              embedded:
                enabled: true
          # DNS runs in the control plane pod, so no CoreDNS pod lands on (and
          # holds) this cluster's GPU node.
          coredns:
            embedded: true
        integrations:
          argoCD:
            enabled: true
            connector: demo-lab
        deploy:
          stacks:
            - name: gpu-operator
              displayName: Simulated GPU driver and GPU Operator
              templateRef:
                name: shared-node-gpu-operator
              parameters:
                gpuOperatorVersion: '{{ .Values.gpuOperatorVersion }}'
                driverVersion: '{{ .Values.driverVersion }}'
                nvmlMockVersion: 0.5.0
                argoProject: default
              prunePolicy: Prune
        # Nightly cleanup of extra GPU nodes. Scaling a workload down doesn't release
        # a node (the parent's Karpenter counts this cluster's DaemonSet copies as
        # ordinary pods; see the README), but sleep scales Deployments to zero and
        # gives DaemonSets a nodeSelector nothing matches, so every node empties and
        # is consolidated. The cluster wakes on its next access. The timezone comes
        # from the control plane cluster's demo.vcluster.com/sleep-timezone
        # annotation (clusters/*.yaml), falling back to UTC.
        sleep:
          auto:
            schedule: "0 0 * * *"
            timezone: '{{ index .Values.loft.clusterAnnotations "demo.vcluster.com/sleep-timezone" | default "UTC" }}'
        sync:
          fromHost:
            nodes:
              enabled: true
              # No syncBackChanges. Combined with enforceTolerations below, it erases
              # the parent pool's taint from the real node: vCluster hides taints the
              # cluster's pods tolerate from the cluster's view of its node, and
              # syncing that view back writes the node's taints without it. The labels
              # the GPU Operator needs on the real node come from the NodeType instead.
              #
              # Syncs only this cluster's node, and adds this nodeSelector to every
              # pod synced to the parent.
              selector:
                labels:
                  demo.vcluster.com/tenant: '{{ .Values.loft.project }}-{{ .Values.loft.virtualClusterName }}'
          toHost:
            pods:
              # The parent's tenant pool is tainted, so only these pods land there.
              enforceTolerations:
                - demo.vcluster.com/tenant-pool=true:NoSchedule
