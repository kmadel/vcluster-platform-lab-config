apiVersion: management.loft.sh/v1
kind: NodeProvider
metadata:
  name: metal3-us-va-blacksburg-dc1
spec:
  properties:
    metal3.vcluster.com/dns-servers: 1.1.1.1,8.8.8.8
    metal3.vcluster.com/network-cidr: 172.22.0.1/24
    metal3.vcluster.com/network-ip-range: 172.22.0.23-172.22.0.250
    vcluster.com/network-data-template-config: vmetal-lan-only-postboot
    vcluster.com/os-image: ubuntu-noble-bootstrap
    vcluster.com/ssh-keys: admin-bastion-host
  metal3:
    clusterRef:
      cluster: spark-cluster
      namespace: metal3-system
    deploy:
      multus:
        enabled: true
        helmValues: |
          namespace: kube-system
          nodeSelector:
            demo.vcluster.com/bmh-host: "true"
      dhcp:
        enabled: true
        version: "0.17.0"
        helmValues: |
          nodeSelector:
            demo.vcluster.com/bmh-host: "true"
          networkAttachmentDefinition:
            vip: 172.22.0.2/24
            config: |
              {
                "cniVersion": "0.3.1",
                "type": "bridge",
                "bridge": "br-provision",
                "ipam": {}
              }
      metal3:
        enabled: true
        version: "0.6.1"
        helmValues: |
          nodeSelector:
            demo.vcluster.com/bmh-host: "true"
          ironic:
            replicas: 2
            image:
              tag: release-32.0
            extraEnv:
              - name: IRONIC_FAST_TRACK
                value: "true"
              - name: IRONIC_AUTOMATED_CLEAN
                value: "false"
          ipaImages:
            replicas: 2

    # ------------------------------------------------------------------------
    # NetBox becomes the inventory. The platform only ever READS NetBox.
    # ------------------------------------------------------------------------
    netBox:
      secretRef:
        namespace: vcluster-platform
        name: netbox-lab
      tag: vcluster-sync
      # sushy-tools keys each emulated server by its libvirt domain UUID, which
      # hack/seed-netbox.py writes into the NetBox device serial. The platform
      # default ends in /Systems/1 and would dial one non-existent system for
      # every host.
      addressTemplate: "redfish+http://{{ .Address }}:8000/redfish/v1/Systems/{{ .Serial }}"
      customFields:
        bmcUsername: bmc_username
        bmcPassword: bmc_password
      bareMetalHostTemplate:
        metadata:
          labels:
            topology.kubernetes.io/region: us-va-blacksburg-dc1
            # The one dimension NetBox has no field for. Every other selector
            # label below is derived from the device record by the import.
            demo: vmetal
        spec:
          automatedCleaningMode: disabled
          rootDeviceHints:
            deviceName: /dev/vda
          bmc:
            disableCertificateVerification: true
          # Deliberately NOT online: true. The import creates hosts with
          # online: false, which is what the claim path needs.

    # ------------------------------------------------------------------------
    # Pools. Label mapping from the hand-rolled lane:
    #   topology.vcluster.com/az           -> netbox.vcluster.com/site
    #   topology.vcluster.com/row          -> netbox.vcluster.com/location
    #   topology.vcluster.com/rack         -> netbox.vcluster.com/rack
    #   inventory.vcluster.com/size        -> netbox.vcluster.com/device-type
    #   inventory.vcluster.com/accelerator -> netbox.vcluster.com/role
    #
    # Never select on netbox.vcluster.com/availability or /provisionable: both
    # change as machines are claimed, and a pool would empty out under load.
    #
    # Machines per pool, against the 10-device inventory seeded 2026-09-17:
    #   rack-a-small 2 | rack-a-medium 1 | rack-a-large 1 | rack-a-xlarge 1
    #   rack-b-small 2 | rack-b-medium 0 | rack-b-large 1 | rack-b-xlarge 1
    #   rack-c-xlarge-gpu 1
    # ------------------------------------------------------------------------
    nodeTypes:
      # ---- rack-c -----------------------------------------------------------
      # The only pool that may select gpu-compute, and its capacity is exactly
      # one machine (the single RTX 2000 Ada passed through to that domain).
      # Size any NodeType consuming it for one machine; a second replica will
      # never schedule. No device-type key, so it keeps working whether the
      # inventory calls that profile `xlarge` or `xlarge-gpu`.
      - name: rack-c-xlarge-gpu-pool
        metadata:
          labels:
            tenants.demo.vcluster.com/acme: "true"
        resources:
          cpu: "8"
          memory: 16Gi
          nvidia.com/gpu: "1"
        bareMetalHosts:
          selector:
            matchLabels:
              demo: vmetal
              machines.vcluster.com/source: netbox
              netbox.vcluster.com/site: us-va-blacksburg-dc1
              netbox.vcluster.com/location: row-1
              netbox.vcluster.com/rack: rack-c
              netbox.vcluster.com/role: gpu-compute
        properties:
          vcluster.com/accelerator: rtx-2000-ada
          vcluster.com/az: us-va-blacksburg-dc1
          vcluster.com/cpu: "8"
          vcluster.com/memory: 16Gi
          vcluster.com/profile: xlarge-gpu
          vcluster.com/rack: rack-c
          vcluster.com/row: row-1

      # A simulated "HGX B200" server: an ordinary vmetal VM (rack-b-u18-xlarge) whose
      # NetBox device type is hgx-b200, and whose 8 GPUs come from NVIDIA nvml-mock,
      # installed on the host by cloud-init before the join (MachineConfigTemplate
      # nvml-mock-b200, infrastructure/). Tenant clusters select it like real GPU
      # capacity (vcluster.com/accelerator: b200) and see a node with a driver already
      # installed. Rack B, not C: rack-c-xlarge-gpu-pool selects every gpu-compute host
      # in rack C. Demo only, nothing CUDA runs; present the GPUs as simulated.
      - name: rack-b-b200-xlarge
        resources:
          cpu: "8"
          memory: 16Gi
          nvidia.com/gpu: "8"
        bareMetalHosts:
          selector:
            matchLabels:
              demo: vmetal
              machines.vcluster.com/source: netbox
              netbox.vcluster.com/site: us-va-blacksburg-dc1
              netbox.vcluster.com/location: row-1
              netbox.vcluster.com/rack: rack-b
              netbox.vcluster.com/role: gpu-compute
              netbox.vcluster.com/device-type: hgx-b200
        properties:
          vcluster.com/accelerator: b200
          vcluster.com/az: us-va-blacksburg-dc1
          vcluster.com/cpu: "8"
          vcluster.com/memory: 16Gi
          vcluster.com/profile: xlarge-gpu
          vcluster.com/rack: rack-b
          vcluster.com/row: row-1
          # The "driver": nvml-mock from cloud-init, 8 GPUs (built into the template,
          # which is named for the server type so the node label reads normally).
          vcluster.com/user-data-template-config: hgx-b200
          # Single-valued properties become node labels: the driver and container
          # toolkit are preinstalled, so the GPU Operator must not deploy them here.
          nvidia.com/gpu.deploy.driver: "false"
          nvidia.com/gpu.deploy.container-toolkit: "false"

      # A simulated GB300 NVL72 compute tray in rack A (rack-a-u20-xlarge, taken from the
      # KubeVirt provider cluster on 2026-10-20): NetBox device type gb300-tray, 4 GPUs
      # from nvml-mock. MachineConfigTemplate nvidia-gpu-server picks the GB300 profile from
      # vcluster.com/accelerator. No kubernetes.io/arch property: real GB300 trays are
      # arm64 (Grace), this host is x86, and an arm64 label would break every pod.
      - name: rack-a-gb300-tray
        resources:
          cpu: "8"
          memory: 16Gi
          nvidia.com/gpu: "4"
        bareMetalHosts:
          selector:
            matchLabels:
              demo: vmetal
              machines.vcluster.com/source: netbox
              netbox.vcluster.com/site: us-va-blacksburg-dc1
              netbox.vcluster.com/location: row-1
              netbox.vcluster.com/rack: rack-a
              netbox.vcluster.com/role: gpu-compute
              netbox.vcluster.com/device-type: gb300-tray
        properties:
          vcluster.com/accelerator: gb300
          vcluster.com/az: us-va-blacksburg-dc1
          vcluster.com/cpu: "8"
          vcluster.com/memory: 16Gi
          vcluster.com/profile: gpu-tray
          vcluster.com/rack: rack-a
          vcluster.com/row: row-1
          vcluster.com/user-data-template-config: nvidia-gpu-server
          nvidia.com/gpu.deploy.driver: "false"
          nvidia.com/gpu.deploy.container-toolkit: "false"

      # ---- rack-a -----------------------------------------------------------
      - name: rack-a-small-pool
        metadata:
          labels:
            tenants.demo.vcluster.com/acme: "true"
        resources:
          cpu: "2"
          memory: 4Gi
        bareMetalHosts:
          selector:
            matchLabels:
              demo: vmetal
              machines.vcluster.com/source: netbox
              netbox.vcluster.com/site: us-va-blacksburg-dc1
              netbox.vcluster.com/location: row-1
              netbox.vcluster.com/rack: rack-a
              netbox.vcluster.com/device-type: vmetal-small
              netbox.vcluster.com/role: cpu-compute
        properties:
          vcluster.com/accelerator: cpu-only
          vcluster.com/az: us-va-blacksburg-dc1
          vcluster.com/cpu: "2"
          vcluster.com/memory: 4Gi
          vcluster.com/profile: small
          vcluster.com/rack: rack-a
          vcluster.com/row: row-1

      - name: rack-a-medium-pool
        metadata:
          labels:
            tenants.demo.vcluster.com/acme: "true"
        resources:
          cpu: "3"
          memory: 6Gi
        bareMetalHosts:
          selector:
            matchLabels:
              demo: vmetal
              machines.vcluster.com/source: netbox
              netbox.vcluster.com/site: us-va-blacksburg-dc1
              netbox.vcluster.com/location: row-1
              netbox.vcluster.com/rack: rack-a
              netbox.vcluster.com/device-type: vmetal-medium
              netbox.vcluster.com/role: cpu-compute
        properties:
          vcluster.com/accelerator: cpu-only
          vcluster.com/az: us-va-blacksburg-dc1
          vcluster.com/cpu: "3"
          vcluster.com/memory: 6Gi
          vcluster.com/profile: medium
          vcluster.com/rack: rack-a
          vcluster.com/row: row-1

      - name: rack-a-large-pool
        metadata:
          annotations:
            # for kubevirt resources below - skips any NodeType that advertises an extended resource
            nodetype.loft.sh/allow-unneeded-special-resources: "true"
        resources:
          cpu: "4"
          memory: 8Gi
          ephemeral-storage: 20Gi
          devices.kubevirt.io/kvm: "1"
          devices.kubevirt.io/tun: "1"
          devices.kubevirt.io/vhost-net: "1"
        bareMetalHosts:
          selector:
            matchLabels:
              demo: vmetal
              machines.vcluster.com/source: netbox
              netbox.vcluster.com/site: us-va-blacksburg-dc1
              netbox.vcluster.com/location: row-1
              netbox.vcluster.com/rack: rack-a
              netbox.vcluster.com/device-type: vmetal-large
              netbox.vcluster.com/role: cpu-compute
        properties:
          kubernetes.io/arch: amd64
          vcluster.com/accelerator: cpu-only
          vcluster.com/az: us-va-blacksburg-dc1
          vcluster.com/cpu: "4"
          vcluster.com/memory: 8Gi
          vcluster.com/profile: large
          vcluster.com/rack: rack-a
          vcluster.com/row: row-1

      - name: rack-a-xlarge-pool
        metadata:
          annotations:
            nodetype.loft.sh/allow-unneeded-special-resources: "true"
        resources:
          cpu: "8"
          memory: 16Gi
          ephemeral-storage: 40Gi
          devices.kubevirt.io/kvm: "1"
          devices.kubevirt.io/tun: "1"
          devices.kubevirt.io/vhost-net: "1"
        bareMetalHosts:
          selector:
            matchLabels:
              demo: vmetal
              machines.vcluster.com/source: netbox
              netbox.vcluster.com/site: us-va-blacksburg-dc1
              netbox.vcluster.com/location: row-1
              netbox.vcluster.com/rack: rack-a
              netbox.vcluster.com/device-type: vmetal-xlarge
              netbox.vcluster.com/role: cpu-compute
        properties:
          kubernetes.io/arch: amd64
          vcluster.com/accelerator: cpu-only
          vcluster.com/az: us-va-blacksburg-dc1
          vcluster.com/cpu: "8"
          vcluster.com/memory: 16Gi
          vcluster.com/profile: xlarge
          vcluster.com/rack: rack-a
          vcluster.com/row: row-1

      # ---- rack-b -----------------------------------------------------------
      - name: rack-b-small-pool
        metadata:
          labels:
            tenants.demo.vcluster.com/globex: "true"
        resources:
          cpu: "2"
          memory: 4Gi
        bareMetalHosts:
          selector:
            matchLabels:
              demo: vmetal
              machines.vcluster.com/source: netbox
              netbox.vcluster.com/site: us-va-blacksburg-dc1
              netbox.vcluster.com/location: row-1
              netbox.vcluster.com/rack: rack-b
              netbox.vcluster.com/device-type: vmetal-small
              netbox.vcluster.com/role: cpu-compute
        properties:
          vcluster.com/accelerator: cpu-only
          vcluster.com/az: us-va-blacksburg-dc1
          vcluster.com/cpu: "2"
          vcluster.com/memory: 4Gi
          vcluster.com/profile: small
          vcluster.com/rack: rack-b
          vcluster.com/row: row-1

      # NOTE: zero machines. rack-b in the current inventory is small, small,
      # large, xlarge. Kept so the pool list stays symmetric with rack-a; drop
      # it if an always-empty pool in the UI is worse than the asymmetry.
      - name: rack-b-medium-pool
        metadata: {}
        resources:
          cpu: "3"
          memory: 6Gi
        bareMetalHosts:
          selector:
            matchLabels:
              demo: vmetal
              machines.vcluster.com/source: netbox
              netbox.vcluster.com/site: us-va-blacksburg-dc1
              netbox.vcluster.com/location: row-1
              netbox.vcluster.com/rack: rack-b
              netbox.vcluster.com/device-type: vmetal-medium
              netbox.vcluster.com/role: cpu-compute
        properties:
          vcluster.com/accelerator: cpu-only
          vcluster.com/az: us-va-blacksburg-dc1
          vcluster.com/cpu: "3"
          vcluster.com/memory: 6Gi
          vcluster.com/profile: medium
          vcluster.com/rack: rack-b
          vcluster.com/row: row-1

      - name: rack-b-large-pool
        metadata:
          labels:
            tenants.demo.vcluster.com/globex: "true"
          annotations:
            nodetype.loft.sh/allow-unneeded-special-resources: "true"
        resources:
          cpu: "4"
          memory: 8Gi
          ephemeral-storage: 20Gi
          devices.kubevirt.io/kvm: "1"
          devices.kubevirt.io/tun: "1"
          devices.kubevirt.io/vhost-net: "1"
        bareMetalHosts:
          selector:
            matchLabels:
              demo: vmetal
              machines.vcluster.com/source: netbox
              netbox.vcluster.com/site: us-va-blacksburg-dc1
              netbox.vcluster.com/location: row-1
              netbox.vcluster.com/rack: rack-b
              netbox.vcluster.com/device-type: vmetal-large
              netbox.vcluster.com/role: cpu-compute
        properties:
          kubernetes.io/arch: amd64
          vcluster.com/accelerator: cpu-only
          vcluster.com/az: us-va-blacksburg-dc1
          vcluster.com/cpu: "4"
          vcluster.com/memory: 8Gi
          vcluster.com/profile: large
          vcluster.com/rack: rack-b
          vcluster.com/row: row-1

      - name: rack-b-xlarge-pool
        metadata:
          labels:
            tenants.demo.vcluster.com/globex: "true"
          annotations:
            nodetype.loft.sh/allow-unneeded-special-resources: "true"
        resources:
          cpu: "8"
          memory: 16Gi
          ephemeral-storage: 40Gi
          devices.kubevirt.io/kvm: "1"
          devices.kubevirt.io/tun: "1"
          devices.kubevirt.io/vhost-net: "1"
        bareMetalHosts:
          selector:
            matchLabels:
              demo: vmetal
              machines.vcluster.com/source: netbox
              netbox.vcluster.com/site: us-va-blacksburg-dc1
              netbox.vcluster.com/location: row-1
              netbox.vcluster.com/rack: rack-b
              netbox.vcluster.com/device-type: vmetal-xlarge
              netbox.vcluster.com/role: cpu-compute
        properties:
          kubernetes.io/arch: amd64
          vcluster.com/accelerator: cpu-only
          vcluster.com/az: us-va-blacksburg-dc1
          vcluster.com/cpu: "8"
          vcluster.com/memory: 16Gi
          vcluster.com/profile: xlarge
          vcluster.com/rack: rack-b
          vcluster.com/row: row-1
  displayName: Metal3 Provider (us-va-blacksburg-dc1)

