# Generated by cloud-init/render.sh (profile b200, 8 GPU per node,
# nvml-mock 0.5.0). Edit files/ and re-run instead of editing this.
#
# Attach to a node with the property
#   vcluster.com/user-data-template-config: hgx-b200
# on a tenant cluster's Auto Nodes pool (properties) or on a NodeType. Optional per-node
# GPU count override: property nvml-mock.vcluster.com/gpu-count.
apiVersion: management.loft.sh/v1
kind: MachineConfigTemplate
metadata:
  name: hgx-b200
  labels:
    app.kubernetes.io/part-of: ce-demo-nvml-mock
spec:
  displayName: nvml-mock simulated B200 (cloud-init)
  owner:
    team: loft-admins
  cloudInitTemplate: |
    #cloud-config
    write_files:
      - path: /etc/nvml-mock/nvml-mock.env
        permissions: "0644"
        content: |
          NVML_MOCK_IMAGE=ghcr.io/nvidia/nvml-mock:0.5.0
          GPU_COUNT={{ index .Values.Properties "nvml-mock.vcluster.com/gpu-count" | default "8" }}
          DRIVER_VERSION=580.65.06
          MOCK_IB=sysfs
          MOCK_IB_PING_FABRIC=0
          MOCK_NVML_CONFIG=/etc/nvml-mock/config.yaml
          MOCK_NVML_OVERRIDES=/var/lib/nvml-mock/driver/config/overrides.yaml
          MOCK_NVML_KMSG=/dev/kmsg
          MOCK_MIG_PROFILES_CONFIG=/etc/nvml-mock/mig/mig-profiles.yaml
          MOCK_IB_PING_SOCKET=/var/lib/nvml-mock/run/mock-ib.sock
          MOCK_IB_ROOT=/var/lib/nvml-mock/ib
          MOCK_PCI_ROOT=/var/lib/nvml-mock
      - path: /etc/nvml-mock/config.yaml
        permissions: "0644"
        encoding: gzip+base64
        content: 
      - path: /etc/nvml-mock/mig/mig-profiles.yaml
        permissions: "0644"
        encoding: gzip+base64
        content: 
      - path: /usr/local/sbin/nvml-mock-install.sh
        permissions: "0755"
        content: |
          #!/bin/bash
          # Installs NVIDIA nvml-mock on this host from its container image, after vCluster's
          # join has finished, then hands over to the agent and NRI plugin units.
          #
          # Waits for the join first because the join replaces containerd and its config.toml
          # (and nvml-mock edits both), and because ctr only exists once the join installed it.
          set -euo pipefail
          
          . /etc/nvml-mock/nvml-mock.env
          
          MARKER=/var/lib/nvml-mock-install/installed
          MNT=/run/nvml-mock-image
          NS=nvml-mock
          
          log() { echo "nvml-mock-install: $*"; }
          
          if [ -f "$MARKER" ] && [ "$(cat "$MARKER")" = "$NVML_MOCK_IMAGE" ]; then
            log "already installed ($NVML_MOCK_IMAGE)"
            exit 0
          fi
          
          # kubelet.conf is the last thing a vCluster worker join writes.
          log "waiting for the node to join"
          for _ in $(seq 1 720); do
            if [ -f /etc/kubernetes/kubelet.conf ] && [ -S /run/containerd/containerd.sock ] \
              && systemctl is-active --quiet containerd && systemctl is-active --quiet kubelet \
              && command -v ctr >/dev/null 2>&1; then
              break
            fi
            sleep 5
          done
          [ -f /etc/kubernetes/kubelet.conf ] || { log "node never joined"; exit 1; }
          
          log "pulling $NVML_MOCK_IMAGE"
          pull_args=()
          [ -d /etc/containerd/certs.d ] && pull_args+=(--hosts-dir /etc/containerd/certs.d)
          for attempt in 1 2 3 4 5; do
            ctr -n "$NS" images pull "${pull_args[@]}" "$NVML_MOCK_IMAGE" >/dev/null && break
            log "pull failed (attempt $attempt), retrying"
            sleep $((attempt * 10))
          done
          
          mkdir -p "$MNT"
          ctr -n "$NS" images unmount --rm "$MNT" >/dev/null 2>&1 || true
          ctr -n "$NS" images mount "$NVML_MOCK_IMAGE" "$MNT" >/dev/null
          trap 'ctr -n "$NS" images unmount --rm "$MNT" >/dev/null 2>&1 || true' EXIT
          
          # The agent stages from its own image paths, so the files go to the same paths here.
          log "installing binaries and libraries"
          install -d /usr/local/bin /usr/local/lib /usr/local/libexec/nvml-mock
          for f in node-agent nri-plugin nvml-mock-ctl nvidia-smi check-fabric; do
            [ -e "$MNT/usr/local/bin/$f" ] && cp -a "$MNT/usr/local/bin/$f" /usr/local/bin/
          done
          # The image ships the libraries as regular files (no .so.1 symlinks) plus .h stubs that
          # are not ELF; skip the stubs, and ldconfig's "is not a symbolic link" notes are expected.
          for f in "$MNT"/usr/local/lib/libnvidia-ml.so* "$MNT"/usr/local/lib/libcuda.so* \
            "$MNT"/usr/local/lib/libmockfs.so* "$MNT"/usr/local/lib/libibmock*.so*; do
            case "$f" in *.h) continue ;; esac
            cp -a "$f" /usr/local/lib/
          done
          cp -a "$MNT"/usr/local/libexec/nvml-mock/. /usr/local/libexec/nvml-mock/
          if [ -d "$MNT/usr/local/nvml-mock-ib" ]; then
            rm -rf /usr/local/nvml-mock-ib
            cp -a "$MNT/usr/local/nvml-mock-ib" /usr/local/nvml-mock-ib
          fi
          ldconfig 2>&1 | grep -v "is not a symbolic link" || true
          
          mkdir -p "$(dirname "$MARKER")"
          echo "$NVML_MOCK_IMAGE" > "$MARKER"
          log "installed; starting the agent"
          systemctl start --no-block nvml-mock-agent.service
      - path: /usr/local/sbin/nvml-mock-agent-start.sh
        permissions: "0755"
        content: |
          #!/bin/bash
          # The nvml-mock DaemonSet's node-agent container, run on the host: the host root is
          # "/" instead of a /host mount, health is on loopback, and the profile ConfigMaps are
          # files under /etc/nvml-mock.
          set -euo pipefail
          set -a
          . /etc/nvml-mock/nvml-mock.env
          set +a
          export NODE_NAME="${NODE_NAME:-$(hostname)}"
          mkdir -p /run/nvml-mock /var/lib/nvml-mock /run/nvidia /var/run/cdi \
            /etc/kubernetes/node-feature-discovery/features.d /usr/local/nvml-mock \
            /etc/nvidia-container-runtime /etc/containerd/conf.d
          exec /usr/local/bin/node-agent start \
            --config=/etc/nvml-mock/config.yaml \
            --host-root=/ \
            --health-addr=127.0.0.1:9091 \
            --log-level=info \
            --log-format=json \
            --shutdown-timeout=5s \
            --resync-interval=1m \
            --staging-lock-path=/run/nvml-mock/nri-staging.lock \
            --container-runtime=containerd \
            --container-runtime-restart=systemd \
            --container-runtime-config=/etc/containerd/config.toml \
            --container-runtime-config-dir=/etc/containerd/conf.d \
            --container-runtime-systemd-unit=containerd \
            --container-runtime-nri-socket=/var/run/nri/nri.sock \
            --host-fs=/
      - path: /usr/local/sbin/nvml-mock-nri-start.sh
        permissions: "0755"
        content: |
          #!/bin/bash
          # The nvml-mock DaemonSet's NRI plugin container, run on the host. Waits for the
          # agent to report the mock driver staged, as the pod's startup probe did.
          set -euo pipefail
          set -a
          . /etc/nvml-mock/nvml-mock.env
          set +a
          export NODE_NAME="${NODE_NAME:-$(hostname)}"
          for _ in $(seq 1 300); do
            curl -fsS -o /dev/null http://127.0.0.1:9091/stagedz && break
            sleep 2
          done
          exec /usr/local/bin/nri-plugin \
            --socket-path=/var/run/nri/nri.sock \
            --plugin-name=nvml-mock \
            --plugin-index=10 \
            --overlay-host-path=/var/lib/nvml-mock \
            --overlay-mount-path=/opt/nvml-mock \
            --device-host-path=/var/lib/nvml-mock/driver/dev \
            --opt-out-annotation=nvml-mock.nvidia.com/inject \
            --device-annotation=nvml-mock.nvidia.com/devices \
            --device-injection-mode=raw \
            --cdi-spec-host-path=/var/run/cdi/nvml-mock-nri.yaml \
            --imex-channel-annotation=nvml-mock.nvidia.com/imex-channels \
            --imex-channel-host-path=/var/lib/nvml-mock/driver/dev/nvidia-caps-imex-channels \
            --infiniband-annotation=nvml-mock.nvidia.com/infiniband \
            --excluded-namespaces=kube-system \
            --node-name="$NODE_NAME" \
            --health-addr=127.0.0.1:18080 \
            --agent-staged-url=http://127.0.0.1:9091/stagedz \
            --staging-lock-path=/run/nvml-mock/nri-staging.lock \
            --log-level=info \
            --log-format=json
      - path: /usr/local/sbin/nvml-mock-ctl
        permissions: "0755"
        content: |
          #!/bin/bash
          # Runs an nvml-mock tool with the environment the DaemonSet gave `kubectl exec`, so
          # it resolves the same profile, overrides and mock trees a workload sees.
          # Installed as /usr/local/sbin/nvml-mock-ctl (ahead of /usr/local/bin in PATH).
          set -euo pipefail
          set -a
          . /etc/nvml-mock/nvml-mock.env
          set +a
          export LD_PRELOAD=/usr/local/lib/libibmockumad.so.1:/usr/local/lib/libibmockverbs.so.1:/usr/local/lib/libibmocksys.so.1:/usr/local/lib/libmockfs.so.1
          exec "/usr/local/bin/$(basename "$0")" "$@"
      - path: /etc/systemd/system/nvml-mock-install.service
        permissions: "0644"
        content: |
          [Unit]
          Description=Install NVIDIA nvml-mock once this node has joined its tenant cluster
          After=network-online.target
          Wants=network-online.target
          
          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/usr/local/sbin/nvml-mock-install.sh
          TimeoutStartSec=90min
          
          [Install]
          WantedBy=multi-user.target
      - path: /etc/systemd/system/nvml-mock-agent.service
        permissions: "0644"
        content: |
          [Unit]
          Description=NVIDIA nvml-mock node agent (simulated GPU driver)
          After=nvml-mock-install.service containerd.service
          Requires=nvml-mock-install.service
          ConditionPathExists=/var/lib/nvml-mock-install/installed
          
          [Service]
          ExecStart=/usr/local/sbin/nvml-mock-agent-start.sh
          ExecStartPost=-/bin/systemctl start --no-block nvml-mock-nri.service
          Restart=always
          RestartSec=5
          KillMode=mixed
          TimeoutStopSec=15
          
          [Install]
          WantedBy=multi-user.target
      - path: /etc/systemd/system/nvml-mock-nri.service
        permissions: "0644"
        content: |
          [Unit]
          Description=NVIDIA nvml-mock NRI plugin (injects simulated GPU devices)
          After=nvml-mock-agent.service
          BindsTo=nvml-mock-agent.service
          ConditionPathExists=/var/lib/nvml-mock-install/installed
          
          [Service]
          ExecStart=/usr/local/sbin/nvml-mock-nri-start.sh
          Restart=always
          RestartSec=5
          
          [Install]
          WantedBy=multi-user.target
    # Runs before the Platform's join command (appended after these). The install
    # unit waits for the join to finish, so it must not block here.
    runcmd:
      - [systemctl, daemon-reload]
      - [systemctl, enable, nvml-mock-install.service, nvml-mock-agent.service, nvml-mock-nri.service]
      - [systemctl, start, --no-block, nvml-mock-install.service]
