# fleet-bindings.yaml - Layer 1: the fleet binding controller and the FleetProfile
# policy it reconciles against. Replaces the out-of-band `helm install` of the
# fleet-bindings chart; this Application is now the owner.
#
# Wave 0, and the only app in bootstrap/ above -1, on purpose. The controller
# consumes what the wave -1 apps produce, so it has to run last:
#   fleet-clusters     -> the Cluster labels it selects on and the
#                         fleet.lab.kurtmadel.com/profiles annotations it reads
#   fleet-baseline     -> the ArgoCDApplicationTemplates the profiles name
#   tenant-management  -> the collector templates the observability profiles name
# Bind anything earlier and the generated ArgoCDApplications reference templates
# that do not exist yet. Raise this above 0 if an app is ever added at wave 0
# that fleet-bindings depends on.
#
# The chart defaults are already written for this lab (fleet.lab.kurtmadel.com
# annotations, vcp/otel.lab.kurtmadel.com endpoints), so only the two values that
# diverge are overridden below. The profiles below are pinned even where they
# match the chart: which applications land on which cluster is this environment's
# policy, and it should not change silently on a chart bump.
#
# Note: cluster-collector, fleet-observability-grafana and
# fleet-observability-prometheus are ArgoCDApplicationTemplates installed by
# vCluster Platform itself, so they are intentionally absent from baseline/ and
# tenant-management/. Profiles here reference them by name like any other
# template; this repo does not define them.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fleet-bindings
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: oci://ghcr.io/loft-demos/vcluster-fleet-gitops/fleet-bindings
    targetRevision: 0.6.2
    path: .
    helm:
      releaseName: fleet-bindings
      valuesObject:
        # Central policy namespace: FleetProfiles and Cluster-targeted
        # ArgoCDApplications live here. VCI-targeted ones live in each VCI's
        # own project namespace.
        projectNamespace: p-platform

        controller:
          # Chart default is 30s; this fleet runs a tighter loop.
          reconcileInterval: 15s

        profiles:
          control-plane-baseline:
            applications:
              - name: cert-manager
              - name: godaddy-webhook
                dependsOn:
                  - cert-manager
              - name: godaddy-clusterissuer
                dependsOn:
                  - godaddy-webhook
              - name: metrics-server
              - name: metallb
              - name: metallb-config
                dependsOn:
                  - metallb
              - name: envoy-gateway
              - name: cert-config
                dependsOn:
                  - godaddy-clusterissuer
              - name: envoy-gateway-config
                dependsOn:
                  - envoy-gateway
                  - metallb-config
                  - cert-config
              - name: external-dns
                dependsOn:
                  - envoy-gateway-config

          # Auto-selected for rendered VCIs with privateNodes.enabled: true.
          # Chart default is "cluster-collector"; this fleet uses the embedded
          # etcd variant in tenant-management/argocd-templates.
          tenant-observability-private-nodes:
            applications:
              - name: cluster-collector-with-embedded-etcd

          # Auto-selected for rendered VCIs without private nodes.
          tenant-observability-shared-nodes:
            applications:
              - name: shared-node-tenant-collector

          # Selected by loft-cluster. The FleetProfile went missing (most likely
          # dropped from the Helm values, which deleted it), so the controller
          # logged `unknown FleetProfile "fleet-observability-platform"` every
          # pass and froze this cluster's bindings instead of reconciling them.
          # Reconstructed from the three orphaned bindings in p-platform.
          # dependsOn is not recovered: it only gates creation of bindings that
          # do not exist yet, so it is a no-op here but would matter on a rebuild.
          fleet-observability-platform:
            applications:
              - name: cluster-collector
              - name: fleet-observability-prometheus
              - name: fleet-observability-grafana

          # Selected by spark-cluster. Was hand-created in p-platform and not
          # owned by Helm; declared here so this file owns it.
          fleet-observability-collector:
            applications:
              - name: cluster-collector

          gpu-nvidia-baseline:
            applications:
              - name: nvidia-gpu-operator
              - name: nvidia-dra-driver-gpu

          gpu-amd-baseline:
            applications:
              - name: amd-gpu-operator
              - name: amd-dra-driver

          # Replicated block storage (baseline/longhorn.yaml). A cluster opts in
          # by listing this profile, which is the install gate: add it only once
          # the cluster's nodes are prepared (storage/README.md). Each cluster
          # also needs fleet.lab.kurtmadel.com/longhorn-backup-target.
          storage-longhorn:
            applications:
              - name: longhorn

        # Escape hatch for hand-pinned bindings. Bindings should come from
        # Cluster metadata via the controller, so this stays off.
        staticBindings:
          enabled: false
          clusters: []
  destination:
    server: https://kubernetes.default.svc
    namespace: vcluster-platform
  syncPolicy:
    automated:
      # Generated ArgoCDApplication bindings are owned and pruned by the
      # fleet-binding-controller, not by Argo CD. Prune stays off so the
      # controller can adopt bindings created by the previous Helm release.
      prune: false
      selfHeal: true
