# shared-node-gpu-test-matrix - the elastic parent, its GPU test matrix project and
# clusters, and the parent's DCGM collector. See shared-node-gpu-test-matrix/README.md.
#
# The tenant NodeType it needs (kvm-gb300-1gpu-tenant) is defined with the other
# KubeVirt NodeTypes in private-node-kubevirt-provider/kubevirt-provider.yaml, and
# the GB300 tray it runs on is gpu-tray-host in
# private-node-kubevirt-provider/private-node-provider-dynamic-template.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shared-node-gpu-test-matrix
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://forgejo.apps.lab.kurtmadel.com/vcluster-demos/platform-config.git
    targetRevision: main
    path: shared-node-gpu-test-matrix
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: vcluster-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # The clusters (wave 2) can't be admitted until elastic-cp-parent is connected
    # as a control plane cluster, which is a one-time CLI step on a fresh build.
    retry:
      limit: -1
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
