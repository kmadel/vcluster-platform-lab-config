# Metadata-only server-side-apply overlay for the local Cluster resource that
# vCluster Platform creates during installation. Platform remains the owner of
# spec, connection state, finalizers, and status; Git owns only fleet selection
# and non-secret parameters consumed by the Argo CD templates.
apiVersion: management.loft.sh/v1
kind: Cluster
metadata:
  name: loft-cluster
  labels:
    # The controller's clusterSelector matches on this exact label. The live
    # object already carries it from an out-of-band apply; recorded here so a
    # rebuilt management cluster is still selected.
    fleet.lab.kurtmadel.com/baseline: "true"
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    fleet.lab.kurtmadel.com/metallb-pool: "192.168.50.0/24"
    fleet.lab.kurtmadel.com/gateway-lb-ip: "192.168.50.10"
    fleet.lab.kurtmadel.com/base-domain: "lab.kurtmadel.com"
    fleet.lab.kurtmadel.com/dns-zone: "kurtmadel.com"
    fleet.lab.kurtmadel.com/cluster-issuer: "letsencrypt-prod"
    fleet.lab.kurtmadel.com/platform-hostname: "vcp.lab.kurtmadel.com"
    # Listener the demo-frontend HTTPRoute pins to (tenant-management
    # argocd-templates/demo-frontend.yaml). tenant-https, not the *.lab https
    # listener: tenant hostnames live under *.tenant.lab.kurtmadel.com.
    demo.vcluster.com/vcluster-api-gateway-http-listener-name: "tenant-https"
    fleet.lab.kurtmadel.com/profiles: "fleet-observability-platform"
    fleet-observability-grafana.argocd-template-param.fleet.lab.kurtmadel.com/platformHost: "vcp.lab.kurtmadel.com"
    cluster-collector.argocd-template-param.fleet.lab.kurtmadel.com/otlpEndpoint: >-
      https://otel.lab.kurtmadel.com
