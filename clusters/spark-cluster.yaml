apiVersion: management.loft.sh/v1
kind: Cluster
metadata:
  name: spark-cluster
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    # Envoy Gateway supports the HTTPRoute request-mirror filter but doesn't
    # advertise HTTPRouteRequestMirror in GatewayClass status. Without this,
    # sleep mode can't count HTTPRoute traffic as activity and tenant clusters
    # here show NoSupportedGatewayClass.
    sleepmode.loft.sh/request-mirror-controller-allowlist: "gateway.envoyproxy.io/gatewayclass-controller"
    fleet.lab.kurtmadel.com/profiles: >-
      fleet-observability-collector
    cluster-collector.argocd-template-param.fleet.lab.kurtmadel.com/otlpEndpoint: >-
      https://otel.lab.kurtmadel.com
    demo.vcluster.com/vcluster-api-gateway-class-name: eg
    demo.vcluster.com/vcluster-api-gateway-name: spark
    demo.vcluster.com/vcluster-api-gateway-namespace: envoy-gateway-system
    demo.vcluster.com/vcluster-api-subdomain: spark.lab.kurtmadel.com
    demo.vcluster.com/vcluster-tenant-subdomain: spark.lab.kurtmadel.com
  labels:
    demo.vcluster.com/shared: "true"
    fleet.lab.kurtmadel.com/baseline: 'true'