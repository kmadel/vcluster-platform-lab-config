# Desired per-tenant branding. THIS is the file you edit and review in a PR.
#
# Argo CD diffs this ConfigMap like any other object, so branding changes show up
# in `argocd app diff` and drift on this object is detected and corrected. What
# Argo cannot see is the TenantConfig itself: it lives behind a get+create-only
# subresource with no collection to diff against, so the Job in 30-sync-job.yaml
# projects this ConfigMap onto it.
#
# One <tenant>.json per tenant, holding the uiSettings object exactly as the
# TenantConfig spec expects it. An optional <tenant>.svg is embedded as a data:
# URI into .logoURL, so logos stay reviewable as source rather than as base64.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tenant-branding
  namespace: vcluster-platform
data:
  acme.json: |
    {
      "logoBackgroundColor": "#FFFFFF",
      "primaryColor": "#4F46E5",
      "accentColor": "#0891B2",
      "sidebarColor": "#F5F5FF"
    }
  acme.svg: |
    <svg xmlns="http://www.w3.org/2000/svg" width="196" height="44" viewBox="0 0 196 44">
      <path fill="#4F46E5" d="M2 40 22 4 42 40H31L22 23 13 40Z"/>
      <circle cx="22" cy="37" r="4" fill="#0891B2"/>
      <text x="55" y="26" fill="#1E1B4B" font-family="Arial,sans-serif" font-size="28" font-weight="700" letter-spacing="2">ACME</text>
      <text x="57" y="41" fill="#475569" font-family="Arial,sans-serif" font-size="10" font-weight="600" letter-spacing="3">CORP</text>
    </svg>
  globex.json: |
    {
      "logoBackgroundColor": "#FFFFFF",
      "primaryColor": "#047857",
      "accentColor": "#059669",
      "sidebarColor": "#F0F9F5"
    }
  globex.svg: |
    <svg xmlns="http://www.w3.org/2000/svg" width="196" height="44" viewBox="0 0 196 44">
      <path fill="#047857" d="m22 2 6 14 14 6-14 6-6 14-6-14L2 22l14-6Z"/>
      <circle cx="22" cy="22" r="5" fill="#ECFDF5"/>
      <text x="56" y="27" fill="#064E3B" font-family="Arial,sans-serif" font-size="28" font-weight="700" letter-spacing="2">GLOBEX</text>
      <text x="58" y="42" fill="#475569" font-family="Arial,sans-serif" font-size="10" font-weight="600" letter-spacing="3">CORPORATION</text>
    </svg>
