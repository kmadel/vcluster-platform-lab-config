apiVersion: management.loft.sh/v1
kind: Tenant
metadata:
  name: globex
  annotations:
    nico.vcluster.com/org: vcluster-globex
    nico.vcluster.com/node-provider: nico
    nico.vcluster.com/ip-block-prefix-length: "27"
spec:
  displayName: Globex Corporation
  controlPlaneClusters:
    enabled: true
    allow:
      byLabels:
        demo.vcluster.com/shared: "true"
  osImages:
    enabled: true
    allow:
      byLabels:
        demo.vcluster.com/shared: "true"
  sshKeys:
    enabled: true
    allow:
      custom:
        enabled: true
  nodeTypes:
    enabled: true
    allow:
      byLabels:
        tenants.demo.vcluster.com/globex: "true"
    quota:
      byType:
        nico.cpu-small: "1"
        kubevirt-us-va-blacksburg-dc1.kvm-small: "2"  # per-tenant cap on VMs
        metal3-us-va-blacksburg-dc1.rack-b-small-pool: "1"
  templates:
    enabled: true
    allow:
      byLabels:
        demo.vcluster.com/shared: "true"