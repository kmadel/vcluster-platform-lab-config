apiVersion: management.loft.sh/v1
kind: Tenant
metadata:
  name: acme
  annotations:
    nico.vcluster.com/org: vcluster-acme
    nico.vcluster.com/node-provider: nico
    nico.vcluster.com/ip-block-prefix-length: "27"
spec:
  displayName: ACME Corp
  controlPlaneClusters:
    enabled: true
    allow:
      byLabels:
        demo.vcluster.com/shared: "true"
  osImages:
    enabled: true
    allow:
      byLabels:
        demo.vcluster.com/shared: "true"
  sshKeys:
    enabled: true
    allow:
      custom:
        enabled: true
  nodeTypes:
    enabled: true
    allow:
      byName:
        - nico.cpu-small                            
        - kubevirt-us-va-blacksburg-dc1.kvm-small
        - kubevirt-us-va-blacksburg-dc1.kvm-small-reserved
        # exposes the Metal3 provider to acme for provision-for-VMs;
        # quota 0 keeps acme from using the pool for regular nodes
        - metal3-us-va-blacksburg-dc1.rack-a-small-pool
    quota:
      byType:
        nico.cpu-small: "1"
        kubevirt-us-va-blacksburg-dc1.kvm-small: "1"  # per-tenant cap on VMs
        metal3-us-va-blacksburg-dc1.rack-a-small-pool: "0"
  templates:
    enabled: true
    allow:
      byLabels:
        demo.vcluster.com/shared: "true"