apiVersion: management.loft.sh/v1
kind: Tenant
metadata:
  name: acme
  annotations:
    nico.vcluster.com/org: vcluster-acme
    nico.vcluster.com/node-provider: nico
    nico.vcluster.com/ip-block-prefix-length: "27"
spec:
  displayName: ACME Corp
  controlPlaneClusters:
    enabled: true
    allow:
      byLabels:
        demo.vcluster.com/shared: "true"
  osImages:
    enabled: true
    allow:
      byLabels:
        demo.vcluster.com/shared: "true"
  sshKeys:
    enabled: true
    allow:
      custom:
        enabled: true
  nodeTypes:
    enabled: true
    allow:
      byName:
        - nico.cpu-small
    quota:
      byType:
        nico.cpu-small: "1"