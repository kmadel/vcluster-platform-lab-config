apiVersion: infra.loft.sh/v1alpha1
kind: KubeVirtProviderCluster
metadata:
  name: kubevirt-provider-cluster
  namespace: p-platform
spec:
  virtualCluster:
    name: kubevirt-provider-cluster
    clusterRef:
      # Host the Private Node vCluster control plane on the Platform cluster so its
      # agent peers directly with loft instead of relaying through loft-tls-proxy.
      cluster: loft-cluster
    owner:
      # Use a Platform User resource name (for example "admin"), not an email.
      user: admin
    templateRef:
      name: private-node-kubevirt-provider-dynamic
    parameters: |-
      cpuLimit: '24'
  connectedCluster:
    name: kubevirt-provider-cluster
    managementNamespace: vcluster-platform
  agent:
    kubeconfigTTLSeconds: 600
    chart:
      # Pin this to the exact vCluster Platform version under test. tokenSecretRef
      # requires a chart version that contains that feature.
      version: 4.13.0-alpha.18
  nodeProvider:
    name: kubevirt-us-va-blacksburg-dc1
    targetNamespace: vcluster-platform
    # Placement for VMs from every NodeType below. on-demand puts VMs on the
    # provider cluster's shared Auto Nodes, so any granted tenant (acme, globex)
    # and admin clusters can use this provider. Add "reserved" to also allow
    # tenant-dedicated hosts added with "Provision Machine for VMs"; Platform
    # prefers on-demand when both are allowed.
    capacityTypes: [reserved,on-demand]
    template:
      spec:
        displayName: KubeVirt Provider (us-va-blacksburg-dc1)
        properties:
          kubevirt.vcluster.com/image-url: docker://quay.io/containerdisks/ubuntu:24.04
          kubevirt.vcluster.com/root-disk-size: 20Gi
        kubeVirt:
          # The controller overwrites clusterRef.
          clusterRef: {}
          deploy:
            vClusterDeviceOperator:
              enabled: true
              version: 0.2.0
            kubevirt:
              enabled: true
              helmValues: |-
                kubevirt:
                  operator:
                    # Private Node vClusters have no control-plane node, so KubeVirt's
                    # default virt-operator nodeAffinity (requires control-plane/master)
                    # can never match. Null it so virt-operator schedules on the private
                    # worker nodes; nodeSelector (os: linux) and soft anti-affinity remain.
                    affinity:
                      nodeAffinity: null
                  spec:
                    infra:
                      nodePlacement:
                        affinity:
                          # KubeVirt's install strategy dumper and infra
                          # components default to role-label affinity. Private
                          # Node vClusters may have no node-role labels, so pin
                          # infra components to Linux nodes explicitly.
                          nodeAffinity:
                            requiredDuringSchedulingIgnoredDuringExecution:
                              nodeSelectorTerms:
                                - matchExpressions:
                                    - key: kubernetes.io/os
                                      operator: In
                                      values:
                                        - linux
                    configuration:
                      developerConfiguration:
                        # Explicitly require /dev/kvm; never hide missing KVM by
                        # falling back to QEMU software emulation.
                        useEmulation: false
          virtualMachineTemplate:
            spec:
              runStrategy: Always
              template:
                spec:
                  domain:
                    cpu:
                      cores: 2
                    devices:
                      interfaces:
                        - name: default
                          masquerade: {}
                    resources:
                      requests:
                        cpu: "2"
                        memory: 2Gi
                  networks:
                    - name: default
                      pod: {}
          nodeTypes:
            - name: kvm-small
              displayName: KVM VM (2 CPU, 2 GiB)
              maxCapacity: 4
              metadata:
                labels:
                  tenants.demo.vcluster.com/globex: "true"
                  tenants.demo.vcluster.com/acme: "true"
                  topology.kubernetes.io/region: us-va-blacksburg-dc1
                  # UI-only: the provision-for-VMs dialog reads capacity type from a
                  # label; the scheduler uses the capacity-type property. Label values
                  # can't contain commas, so this is just "reserved".
                  kubevirt.vcluster.com/capacity-type: reserved
            - name: kvm-small-reserved
              displayName: KVM VM (2 vCPU, 1 CPU request, 2 GiB) reserved
              maxCapacity: 4
              properties:
                # reserved only; the controller doesn't overwrite a type's own setting
                kubevirt.vcluster.com/capacity-type: reserved
              metadata:
                labels:
                  tenants.demo.vcluster.com/acme: "true"
                  topology.kubernetes.io/region: us-va-blacksburg-dc1
                  kubevirt.vcluster.com/capacity-type: reserved   # UI-only, see bug notes
              mergeVirtualMachineTemplate:
                spec:
                  template:
                    spec:
                      domain:
                        resources:
                          requests:
                            cpu: "1"
