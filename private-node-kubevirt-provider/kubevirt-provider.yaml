apiVersion: infra.loft.sh/v1alpha1
kind: KubeVirtProviderCluster
metadata:
  name: kubevirt-provider-cluster
  namespace: p-platform
spec:
  virtualCluster:
    name: kubevirt-provider-cluster
    clusterRef:
      # Host the Private Node vCluster control plane on the Platform cluster so its
      # agent peers directly with loft instead of going through the shared edge.
      cluster: loft-cluster
    owner:
      # Use a Platform User resource name (for example "admin"), not an email.
      user: admin
    templateRef:
      name: private-node-kubevirt-provider-dynamic
    parameters: |-
      cpuLimit: '24'
  connectedCluster:
    name: kubevirt-provider-cluster
    managementNamespace: vcluster-platform
  agent:
    kubeconfigTTLSeconds: 600
    chart:
      # Pin this to the exact vCluster Platform version under test. tokenSecretRef
      # requires a chart version that contains that feature.
      version: 4.13.0-alpha.18
  nodeProvider:
    name: kubevirt-us-va-blacksburg-dc1
    targetNamespace: vcluster-platform
    # Placement for VMs from every NodeType below. on-demand puts VMs on the
    # provider cluster's shared Auto Nodes, so any granted tenant (acme, globex)
    # and admin clusters can use this provider. Add "reserved" to also allow
    # tenant-dedicated hosts added with "Provision Machine for VMs"; Platform
    # prefers on-demand when both are allowed.
    capacityTypes: [reserved,on-demand]
    template:
      spec:
        displayName: KubeVirt Provider (us-va-blacksburg-dc1)
        properties:
          kubevirt.vcluster.com/image-url: docker://quay.io/containerdisks/ubuntu:24.04
          kubevirt.vcluster.com/root-disk-size: 20Gi
          # Same SSH key the Metal3 provider injects. Without it a VM's cloud-init
          # has no user or key, so a node that boots but never joins cannot be
          # inspected (2026-10-13: vm-tenant's VM never contacted its control plane,
          # and nothing showed why). Resolved by Platform's shared join builder.
          vcluster.com/ssh-keys: admin-bastion-host
          # VM root disks on vmetal's NFS export (nfs-vm-disks, from
          # provider-cluster-storage-app.yaml) instead of local-path on the
          # provider node, so re-imaging a provider node no longer blanks its
          # VMs' disks. Merged onto the provider's default DataVolume; lists
          # replace, so accessModes is RWX only. Applies to VMs created after
          # the change; existing VMs keep local-path until their claim is
          # recreated. See storage/README.md.
          kubevirt.vcluster.com/image-datavolume-template: '{"spec":{"storage":{"storageClassName":"nfs-vm-disks","accessModes":["ReadWriteMany"],"volumeMode":"Filesystem"}}}'
        kubeVirt:
          # The controller overwrites clusterRef.
          clusterRef: {}
          deploy:
            vClusterDeviceOperator:
              enabled: true
              version: 0.2.0
            kubevirt:
              enabled: true
              helmValues: |-
                kubevirt:
                  operator:
                    # Private Node vClusters have no control-plane node, so KubeVirt's
                    # default virt-operator nodeAffinity (requires control-plane/master)
                    # can never match. Null it so virt-operator schedules on the private
                    # worker nodes; nodeSelector (os: linux) and soft anti-affinity remain.
                    affinity:
                      nodeAffinity: null
                  spec:
                    infra:
                      nodePlacement:
                        affinity:
                          # KubeVirt's install strategy dumper and infra
                          # components default to role-label affinity. Private
                          # Node vClusters may have no node-role labels, so pin
                          # infra components to Linux nodes explicitly.
                          nodeAffinity:
                            requiredDuringSchedulingIgnoredDuringExecution:
                              nodeSelectorTerms:
                                - matchExpressions:
                                    - key: kubernetes.io/os
                                      operator: In
                                      values:
                                        - linux
                    configuration:
                      developerConfiguration:
                        # Explicitly require /dev/kvm; never hide missing KVM by
                        # falling back to QEMU software emulation.
                        useEmulation: false
          virtualMachineTemplate:
            spec:
              runStrategy: Always
              template:
                spec:
                  domain:
                    cpu:
                      cores: 2
                    devices:
                      # Bridge, not masquerade, on the pod network: the guest takes
                      # its virt-launcher pod's IP. Masquerade gives every VM
                      # 10.0.2.2, so a tenant cluster with more than one VM has
                      # duplicate node IPs and no pod traffic between its nodes.
                      # Every tenant template using this provider must keep its pod
                      # and service CIDRs off the provider's 10.64.0.0/16 and
                      # 10.128.0.0/16. NodeType merges keep this interface unless
                      # they set their own interfaces list (lists are replaced).
                      interfaces:
                        - name: default
                          bridge: {}
                    resources:
                      requests:
                        cpu: "2"
                        memory: 2Gi
                  networks:
                    - name: default
                      pod: {}
          nodeTypes:
            - name: kvm-small
              displayName: KVM VM (2 CPU, 2 GiB)
              maxCapacity: 4
              metadata:
                labels:
                  tenants.demo.vcluster.com/globex: "true"
                  tenants.demo.vcluster.com/acme: "true"
                  topology.kubernetes.io/region: us-va-blacksburg-dc1
                  # UI-only: the provision-for-VMs dialog reads capacity type from a
                  # label; the scheduler uses the capacity-type property. Label values
                  # can't contain commas, so this is just "reserved".
                  kubevirt.vcluster.com/capacity-type: reserved
              # Off the GPU host: its 8 CPU / 16 GiB are sized for the GPU VM alone.
              # Platform keeps template affinity terms and appends its placement
              # expressions to each, so this survives.
              mergeVirtualMachineTemplate:
                spec:
                  template:
                    spec:
                      affinity:
                        nodeAffinity:
                          requiredDuringSchedulingIgnoredDuringExecution:
                            nodeSelectorTerms:
                              - matchExpressions:
                                  - key: demo.vcluster.com/gpu-host
                                    operator: DoesNotExist
                                  - key: demo.vcluster.com/mock-gpu-host
                                    operator: DoesNotExist
            - name: kvm-small-reserved
              displayName: KVM VM (2 vCPU, 1 CPU request, 2 GiB) reserved
              maxCapacity: 4
              properties:
                # reserved only; the controller doesn't overwrite a type's own setting
                kubevirt.vcluster.com/capacity-type: reserved
              metadata:
                labels:
                  tenants.demo.vcluster.com/acme: "true"
                  topology.kubernetes.io/region: us-va-blacksburg-dc1
                  kubevirt.vcluster.com/capacity-type: reserved   # UI-only, see bug notes
              mergeVirtualMachineTemplate:
                spec:
                  template:
                    spec:
                      domain:
                        resources:
                          requests:
                            cpu: "1"
                      # Off the GPU host (see kvm-small).
                      affinity:
                        nodeAffinity:
                          requiredDuringSchedulingIgnoredDuringExecution:
                            nodeSelectorTerms:
                              - matchExpressions:
                                  - key: demo.vcluster.com/gpu-host
                                    operator: DoesNotExist
                                  - key: demo.vcluster.com/mock-gpu-host
                                    operator: DoesNotExist
            # CPU service workers for the GPU tenant template (cert-manager, the GPU
            # Operator controller, NVSentinel). kvm-small's 2 GiB is too tight for
            # that set; the provider's large hosts are 4 CPU / 8 GiB, so stay well
            # under that.
            - name: kvm-medium
              displayName: KVM VM (2 CPU, 4 GiB)
              maxCapacity: 2
              metadata:
                labels:
                  tenants.demo.vcluster.com/globex: "true"
                  tenants.demo.vcluster.com/acme: "true"
                  topology.kubernetes.io/region: us-va-blacksburg-dc1
              mergeVirtualMachineTemplate:
                spec:
                  template:
                    spec:
                      domain:
                        resources:
                          requests:
                            memory: 4Gi
                      # Off the GPU host (see kvm-small). Without this, the GPU
                      # tenant's own CPU VM lands there first, being the emptiest
                      # node, and leaves the GPU VM unschedulable.
                      affinity:
                        nodeAffinity:
                          requiredDuringSchedulingIgnoredDuringExecution:
                            nodeSelectorTerms:
                              - matchExpressions:
                                  - key: demo.vcluster.com/gpu-host
                                    operator: DoesNotExist
                                  - key: demo.vcluster.com/mock-gpu-host
                                    operator: DoesNotExist
            # The RTX 2000 Ada, passed through twice: vmetal -> provider node
            # rack-c-u12-xlarge-gpu (libvirt hostdev behind a vIOMMU) -> this VM
            # (KubeVirt, resource advertised by HostDevice rtx-2000-ada). One card,
            # so maxCapacity 1. Add this only after the HostDevice reports Ready, or
            # the VM cannot schedule and the claim ends InsufficientCapacity.
            # See gpu-passthrough.md.
            - name: kvm-gpu-rtx-2000-ada
              displayName: KVM VM + RTX 2000 Ada (6 CPU, 10 GiB, 1 GPU)
              maxCapacity: 1
              properties:
                # The only GPU host is a provider auto node, not a reserved host.
                kubevirt.vcluster.com/capacity-type: on-demand
                # GPU Operator images are about 2.9 GB, plus the driver build.
                kubevirt.vcluster.com/root-disk-size: 60Gi
                vcluster.com/accelerator: rtx-2000-ada
              metadata:
                labels:
                  tenants.demo.vcluster.com/globex: "true"
                  tenants.demo.vcluster.com/acme: "true"
                  topology.kubernetes.io/region: us-va-blacksburg-dc1
              # Use the NodeType merge, not the kubevirt.vcluster.com/merge-virtual-
              # machine-template property: that path still reads the wrong property
              # key (ENGCP-1412).
              mergeVirtualMachineTemplate:
                spec:
                  template:
                    spec:
                      # Pinned to the GPU host. The GPU resource request already
                      # implies it; this makes the intent and any failure explicit.
                      affinity:
                        nodeAffinity:
                          requiredDuringSchedulingIgnoredDuringExecution:
                            nodeSelectorTerms:
                              - matchExpressions:
                                  - key: demo.vcluster.com/gpu-host
                                    operator: In
                                    values: ["true"]
                      domain:
                        cpu:
                          cores: 6
                        # UEFI maps the card's large 64-bit BAR more reliably than
                        # SeaBIOS. The Ubuntu cloud image boots either way.
                        firmware:
                          bootloader:
                            efi:
                              secureBoot: false
                        devices:
                          gpus:
                            - name: gpu1
                              deviceName: nvidia.com/RTX_2000_Ada
                        # The provider node has 16 GiB and 8 CPUs. This leaves room
                        # for its kubelet, KubeVirt, and the VFIO memory overhead.
                        resources:
                          requests:
                            cpu: "6"
                            memory: 10Gi
            # Four 1-GPU VMs on the mock "4-GPU server" (mock-gpu-host in
            # private-node-provider-dynamic-template.yaml). The VM gets no GPU device:
            # nvml-mock inside its tenant cluster simulates one GPU per node, so the
            # device plugin, nvidia-smi and dcgm-exporter all see a GPU that is not
            # there. For dashboards and demos only; nothing CUDA runs. No extended
            # resource on this type, so it is claimable like any CPU type.
            # Sized so four fit the 8 CPU / 16 GiB host with room for its kubelet,
            # KubeVirt and the virt-launcher overhead.
            - name: kvm-mock-gpu
              displayName: KVM VM + 1 simulated GPU (2 CPU, 3 GiB)
              maxCapacity: 4
              # Declared, not derived from the VM template, so the GPU is part of the
              # node type's capacity: a dynamic pool can then launch this type for a
              # pod that requests nvidia.com/gpu (vCluster copies these resources into
              # the Karpenter instance type). The provider still only sets VM cores
              # and guest memory from cpu/memory when the template leaves them unset;
              # the 1 CPU / 3 GiB requests below are what the scheduler reserves.
              resources:
                cpu: "2"
                memory: 3Gi
                nvidia.com/gpu: "1"
              properties:
                # The mock host is a provider auto node, like the GPU host.
                kubevirt.vcluster.com/capacity-type: on-demand
                # GPU Operator images (device plugin, GFD, dcgm-exporter, validator)
                # plus nvml-mock; no driver build, so well under the real GPU type.
                kubevirt.vcluster.com/root-disk-size: 30Gi
                vcluster.com/accelerator: mock-gpu
              metadata:
                labels:
                  tenants.demo.vcluster.com/globex: "true"
                  tenants.demo.vcluster.com/acme: "true"
                  topology.kubernetes.io/region: us-va-blacksburg-dc1
              mergeVirtualMachineTemplate:
                spec:
                  template:
                    spec:
                      affinity:
                        nodeAffinity:
                          requiredDuringSchedulingIgnoredDuringExecution:
                            nodeSelectorTerms:
                              - matchExpressions:
                                  - key: demo.vcluster.com/mock-gpu-host
                                    operator: In
                                    values: ["true"]
                      domain:
                        resources:
                          requests:
                            cpu: "1"
                            memory: 3Gi
