apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubevirt-provider-controller
  namespace: argocd
spec:
  project: default
  source:
    repoURL: oci://ghcr.io/loft-demos/charts/kubevirt-provider-controller
    path: .
    targetRevision: 0.3.0
    helm:
      releaseName: kubevirt-provider-controller  # helm list -A
      # valuesObject: {...}                   # copy from: helm get values <release> -n <ns>
  destination:
    server: https://kubernetes.default.svc     # the vCluster Platform management cluster
    namespace: kubevirt-provider-controller-system
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
