apiVersion: management.loft.sh/v1
kind: VirtualClusterTemplate
metadata:
  name: private-node-kubevirt-provider-dynamic
spec:
  displayName: Private Node KubeVirt provider control plane (Dynamic)
  description: |
    Private node vCluster backed by dynamically provisioned VMs via the KubeVirt NodeProvider.
    Nodes are claimed from available node pool and joined as workers automatically.
  template:
    pro:
      enabled: true
    helmRelease:
      chart:
        name: vcluster
        version: 0.37.2
      values: |-
        privateNodes:
          enabled: true
          autoNodes:
            - provider: metal3-us-va-blacksburg-dc1
              dynamic:
                - name: node-pool-1
                  limits:
                    cpu: '{{ .Values.cpuLimit }}'
                  # These nodes hold KubeVirt VMs whose root disks are local-path
                  # volumes on the node itself. If a VM crashes and Karpenter
                  # reclaims its now-empty node, the machine is re-imaged under the
                  # same hostname, and the VM comes back "Running" on a blank disk
                  # (2026-10-11, see gpu-passthrough.md). WhenEmpty never moves a
                  # running VM; 30m gives a crashed VM time to restart in place
                  # before its node, and its disk, is reclaimed.
                  disruption:
                    consolidationPolicy: WhenEmpty
                    consolidateAfter: 30m
                  nodeLabels:
                    kubevirt.io/schedulable: "true"
                    machine-type.node.kubevirt.io/q35: "true"
                  nodeTypeSelector:
                    - property: vcluster.com/profile
                      operator: In
                      values:
                        - large
              # The RTX 2000 Ada host (rack-c-xlarge-gpu-pool, exactly one machine).
              # Static rather than in node-pool-1: dynamic claims skip NodeTypes that
              # advertise an extended resource the claim does not request, and this
              # pool advertises nvidia.com/gpu. The vCluster device operator binds
              # the GPU to vfio-pci on this node and KubeVirt hands it to a VM.
              # See gpu-passthrough.md.
              static:
                - name: gpu-host
                  quantity: 0
                  properties:
                    # Never the NVIDIA image here: a driver holding the card blocks
                    # the vfio-pci bind, and the guest that owns the GPU is the VM.
                    vcluster.com/os-image: ubuntu-noble-bootstrap
                  nodeLabels:
                    kubevirt.io/schedulable: "true"
                    machine-type.node.kubevirt.io/q35: "true"
                    # Selected by HostDevice rtx-2000-ada (provider-cluster/).
                    demo.vcluster.com/gpu-host: "true"
                  nodeTypeSelector:
                    - property: vcluster.com/profile
                      operator: In
                      values:
                        - xlarge-gpu
                # The mock "4-GPU server": a plain xlarge (8 CPU, 16 GiB, no GPU) that
                # holds the kvm-mock-gpu VMs. The GPUs exist only inside each VM's
                # tenant cluster, simulated by nvml-mock, so nothing here is bound to
                # vfio-pci and no HostDevice selects this node. Static for the same
                # reason as gpu-host: one dedicated machine, not autoscaled capacity.
                - name: mock-gpu-host
                  # 0 since 2026-10-20: rack-a-u20-xlarge is a simulated GPU server on the
                  # Metal3 provider (rack-a-gb300-tray). Set back to 1, and retype the host
                  # in NetBox as vmetal-xlarge / cpu-compute, to bring the KubeVirt mock GPU
                  # VMs back.
                  quantity: 0
                  properties:
                    vcluster.com/os-image: ubuntu-noble-bootstrap
                  nodeLabels:
                    kubevirt.io/schedulable: "true"
                    machine-type.node.kubevirt.io/q35: "true"
                    # Pins kvm-mock-gpu here; every other NodeType avoids it.
                    demo.vcluster.com/mock-gpu-host: "true"
                  nodeTypeSelector:
                    - property: vcluster.com/profile
                      operator: In
                      values:
                        - xlarge
                # A simulated GB300 tray (Metal3 NodeType rack-a-gb300-tray: 4 GPUs from
                # nvml-mock, installed by its cloud-init) carved into 1-GPU VMs
                # (kvm-gb300-1gpu). The NVIDIA device plugin (provider-cluster-mock-gpu-
                # device-plugin.yaml) advertises its 4 nvidia.com/gpu, and each VM requests
                # one, so the scheduler fills the tray like a passthrough host. The GPU each
                # VM reports still comes from nvml-mock inside the VM: no device is passed
                # through. Shares the mock-gpu-host label so every other NodeType avoids it.
                - name: gpu-tray-host
                  quantity: 0
                  properties:
                    vcluster.com/os-image: ubuntu-noble-bootstrap
                    # nvml-mock makes "nvidia" containerd's default runtime, and KubeVirt VMs
                    # then fail to start (QEMU can't open /dev/kvm). Keeps runc the default;
                    # the device plugin asks for the nvidia runtime class itself.
                    nvml-mock.vcluster.com/default-runtime: runc
                  nodeLabels:
                    kubevirt.io/schedulable: "true"
                    machine-type.node.kubevirt.io/q35: "true"
                    demo.vcluster.com/mock-gpu-host: "true"
                    demo.vcluster.com/mock-gpu-tray: "true"
                    # Lets the NVIDIA device plugin's default affinity accept this node.
                    nvidia.com/gpu.present: "true"
                  nodeTypeSelector:
                    - property: vcluster.com/accelerator
                      value: gb300
                    # rack-b-gb300-tray-qualification also advertises gb300; pin to the
                    # rack-a tray so this pool never takes the qualification host.
                    - property: vcluster.com/profile
                      value: gpu-tray
          vpn:
            enabled: false
        networking:
          podCIDR: 10.64.0.0/16
          serviceCIDR: 10.128.0.0/16
        controlPlane:
          backingStore:
            etcd:
              embedded:
                enabled: true
          endpoint: 192.168.50.20:443
          proxy:
            extraSANs:
              - 192.168.50.20
          service:
            spec:
              type: LoadBalancer
            annotations:
              metallb.io/loadBalancerIPs: 192.168.50.20
        integrations:
          argoCD:
            enabled: true
            connector: demo-lab
    instanceTemplate:
      metadata:
        labels:
          infra.loft.sh/purpose: kubevirt-provider
  parameters:
    - variable: cpuLimit
      label: CPU Limit
      description: Maximum CPUs that can be provisioned by this node pool.
      options:
        - '4'
        - '8'
        - '12'
        - '16'
        - '24'
      defaultValue: '8'
  access:
    - verbs: [get]
      users: ["*"]