# The NVIDIA GPU Operator against nvml-mock's simulated GPUs. Values follow NVIDIA's
# k8s-test-infra GPU Operator guide, which CI validates on v26.3.3: nvml-mock is the
# driver and the container toolkit, so those operands are off, and dcgm-exporter embeds
# its own host engine, so the standalone DCGM DaemonSet is off too.
#
# Differences from demo-gpu-operator: no CPU service pool (the controllers run on the
# simulated-GPU nodes, which carry no nvidia.com/gpu taint), and no MIG. The
# dcgm-exporter field list is demo-gpu-operator's, so the Fleet GPU dashboards query the
# same series; fields the mock does not implement are skipped by the exporter.
apiVersion: management.loft.sh/v1
kind: ArgoCDApplicationTemplate
metadata:
  name: demo-gpu-operator-mock
spec:
  displayName: Demo NVIDIA GPU Operator (simulated GPUs)
  owner:
    team: loft-admins
  parameters:
    - variable: version
      label: Chart Version
      type: string
      required: true
      defaultValue: v26.3.3
    - variable: project
      label: Argo CD Project
      type: string
      required: true
      defaultValue: default
    - variable: gpuNodePool
      label: GPU Pool Label
      description: Value of workload.example.com/pool on the simulated-GPU nodes.
      type: string
      required: true
      defaultValue: gpu-compute
    - variable: standaloneDCGM
      label: Standalone DCGM Host Engine
      description: Runs nv-hostengine as its own DaemonSet with the nvidia-dcgm Service on 5555, which
        NVSentinel polls. Off, dcgm-exporter embeds its own host engine, which is enough for metrics.
      type: boolean
      defaultValue: 'false'
  template:
    spec:
      destination:
        namespace: gpu-operator
      project: '{{ .Values.project }}'
      source:
        chart: gpu-operator
        repoURL: https://helm.ngc.nvidia.com/nvidia
        targetRevision: '{{ .Values.version }}'
        helm:
          releaseName: gpu-operator
          values: |
            operator:
              defaultRuntime: containerd
              nodeSelector:
                kubernetes.io/os: linux
              tolerations: []
            driver:
              enabled: false
            toolkit:
              enabled: false
            # Standalone nv-hostengine only when NVSentinel needs its 5555 Service (NVIDIA's
            # NVSentinel-on-nvml-mock guide); dcgm-exporter then uses it instead of its own.
            dcgm:
              enabled: {{ eq (.Values.standaloneDCGM | toString) "true" }}
            mig:
              strategy: none
            migManager:
              enabled: false
            nodeStatusExporter:
              enabled: false
            cdi:
              enabled: true
              default: true
            devicePlugin:
              enabled: true
              config:
                name: ""
            gfd:
              enabled: true
              env:
                - name: GFD_MACHINE_TYPE_FILE
                  value: /etc/nvml-mock/machine-type
            validator:
              driver:
                env:
                  - name: DISABLE_DEV_CHAR_SYMLINK_CREATION
                    value: "true"
              toolkit:
                env:
                  - name: NVIDIA_VISIBLE_DEVICES
                    value: all
              cuda:
                env:
                  # CUDA is not simulated.
                  - name: WITH_WORKLOAD
                    value: "false"
            dcgmExporter:
              enabled: true
              repository: nvcr.io/nvidia/k8s
              image: dcgm-exporter
              version: 4.5.3-4.8.2-distroless
              enablePodLabels: false
              enablePodUID: false
              env:
                - name: DCGM_EXPORTER_COLLECT_INTERVAL
                  value: "5000"
              config:
                create: true
                name: custom-dcgm-exporter-metrics
                data: |-
                  # Format: DCGM field, Prometheus metric type, help message. Lines starting with '#' are comments.
                  # Same set as demo-gpu-operator, so the shipped dashboards find every series they query.
                  DCGM_FI_DEV_SM_CLOCK,  gauge, SM clock frequency (in MHz).
                  DCGM_FI_DEV_MEM_CLOCK, gauge, Memory clock frequency (in MHz).
                  DCGM_FI_DEV_MEMORY_TEMP, gauge, Memory temperature (in C).
                  DCGM_FI_DEV_GPU_TEMP,    gauge, GPU temperature (in C).
                  DCGM_FI_DEV_POWER_USAGE,              gauge, Power draw (in W).
                  DCGM_FI_DEV_TOTAL_ENERGY_CONSUMPTION, counter, Total energy consumption since boot (in mJ).
                  DCGM_FI_DEV_PCIE_REPLAY_COUNTER, counter, Total number of PCIe retries.
                  DCGM_FI_DEV_GPU_UTIL,      gauge, GPU utilization (in %).
                  DCGM_FI_DEV_MEM_COPY_UTIL, gauge, Memory utilization (in %).
                  DCGM_FI_DEV_ENC_UTIL,      gauge, Encoder utilization (in %).
                  DCGM_FI_DEV_DEC_UTIL,      gauge, Decoder utilization (in %).
                  DCGM_FI_DEV_XID_ERRORS,    gauge, Value of the last XID error encountered.
                  DCGM_FI_DEV_FB_FREE, gauge, Framebuffer memory free (in MiB).
                  DCGM_FI_DEV_FB_USED, gauge, Framebuffer memory used (in MiB).
                  DCGM_FI_DEV_FB_RESERVED, gauge, Framebuffer memory reserved (in MiB).
                  DCGM_FI_DEV_NVLINK_BANDWIDTH_TOTAL, gauge, Total number of NVLink bandwidth counters for all lanes.
                  DCGM_FI_DEV_VGPU_LICENSE_STATUS, gauge, vGPU License status.
                  DCGM_FI_DEV_UNCORRECTABLE_REMAPPED_ROWS, counter, Number of remapped rows for uncorrectable errors.
                  DCGM_FI_DEV_CORRECTABLE_REMAPPED_ROWS,   counter, Number of remapped rows for correctable errors.
                  DCGM_FI_DEV_ROW_REMAP_FAILURE,           gauge,   Whether remapping of rows has failed.
                  DCGM_FI_DRIVER_VERSION, label, Driver Version.
                  DCGM_FI_PROF_GR_ENGINE_ACTIVE,   gauge, Ratio of time the graphics engine is active.
                  DCGM_FI_PROF_PIPE_TENSOR_ACTIVE, gauge, Ratio of cycles the tensor (HMMA) pipe is active.
                  DCGM_FI_PROF_DRAM_ACTIVE,        gauge, Ratio of cycles the device memory interface is active.
                  DCGM_FI_PROF_PCIE_TX_BYTES,      gauge, Rate of data transmitted over the PCIe bus in bytes per second.
                  DCGM_FI_PROF_PCIE_RX_BYTES,      gauge, Rate of data received over the PCIe bus in bytes per second.
                  DCGM_EXP_XID_ERRORS_COUNT, counter, Count of XID errors within the last counter window.
                  DCGM_FI_DEV_NVLINK_CRC_FLIT_ERROR_COUNT_TOTAL, counter, Total number of NVLink FLIT CRC errors.
                  DCGM_FI_DEV_NVLINK_CRC_DATA_ERROR_COUNT_TOTAL, counter, Total number of NVLink data CRC errors.
              serviceMonitor:
                enabled: false
            nfd:
              enabled: true
            node-feature-discovery:
              postDeleteCleanup: false
              master:
                nodeSelector:
                  kubernetes.io/os: linux
              gc:
                nodeSelector:
                  kubernetes.io/os: linux
              worker:
                nodeSelector:
                  kubernetes.io/os: linux
                  workload.example.com/pool: {{ .Values.gpuNodePool | quote }}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 5m
          limit: 10
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - SkipDryRunOnMissingResource=true
