apiVersion: management.loft.sh/v1
kind: ArgoCDApplicationTemplate
metadata:
  name: demo-frontend
spec:
  displayName: Demo frontend
  description: Frontend chart, wired to a backend endpoint and token supplied as parameters.
  parameters:
    - variable: repoURL
      label: Git repository URL
      type: string
      required: true
    - variable: targetRevision
      label: Target revision
      type: string
      defaultValue: main
    - variable: namespace
      label: Target namespace
      type: string
      defaultValue: demo-frontend
    # These two are what the Stack fills from the backend task's outputs. The
    # template does not know or care that they were captured rather than typed.
    - variable: backendEndpoint
      label: Backend endpoint
      type: string
      required: true
    - variable: backendToken
      label: Backend API token
      type: password
      required: true
    # Gateway API exposure. Off unless the tenant cluster is configured with
    # sync.fromHost.gateways and sync.toHost.gatewayApi.httpRoutes.
    - variable: httpRouteEnabled
      label: Expose through a Gateway
      type: boolean
      defaultValue: "false"
    - variable: hostname
      label: Hostname
      type: string
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: demo-app
    spec:
      project: default
      source:
        repoURL: "{{ .Values.repoURL }}"
        path: charts/frontend
        targetRevision: "{{ .Values.targetRevision }}"
        helm:
          releaseName: frontend
          values: |-
            backend:
              url: "http://{{ .Values.backendEndpoint }}:8080"
              token: "{{ .Values.backendToken }}"
            httpRoute:
              enabled: {{ .Values.httpRouteEnabled }}
              gateway:
                name: '{{ index .Values.loft.clusterAnnotations "demo.vcluster.com/vcluster-api-gateway-name" }}' 
                namespace: '{{ index .Values.loft.clusterAnnotations "demo.vcluster.com/vcluster-api-gateway-namespace" }}'
              {{- if .Values.hostname }}
              hostnames:
                - "{{ .Values.hostname }}"
              {{- end }}
      destination:
        namespace: "{{ .Values.namespace }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true