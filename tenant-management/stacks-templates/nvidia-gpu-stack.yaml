apiVersion: management.loft.sh/v1
kind: StackTemplate
metadata:
  name: demo-gpu
spec:
  displayName: Demo - NVIDIA GPU Stack
  description: NVIDIA GPU Operator and NVSentinel on GPU workers, with cert-manager and stack controllers on CPU
    service workers, gated on GPUs the scheduler can actually see.
  # NVIDIA's own NGC catalog logo for the GPU Operator, the icon in its Chart.yaml.
  icon: https://assets.nvidiagrid.net/ngc/logos/GPUoperator.png
  owner:
    team: loft-admins
  parameters:
    - variable: cpuNodePool
      label: CPU Service Pool Label
      description: Value of workload.example.com/pool on CPU service workers.
      type: string
      required: true
      defaultValue: cpu-services
    - variable: gpuOperatorVersion
      label: GPU Operator Version
      type: string
      defaultValue: v26.3.3
    - variable: nvsentinelVersion
      label: NVSentinel Chart and Image Version
      type: string
      defaultValue: v1.13.0
    - variable: driverPreinstalled
      label: NVIDIA Driver Preinstalled
      description: Enable when the node OS image already contains the NVIDIA driver.
      type: boolean
      defaultValue: 'false'
    - variable: certManagerPreinstalled
      label: cert-manager Already Installed
      description: Enable when the tenant cluster already runs cert-manager. The cert-manager task then verifies
        that installation instead of installing its own.
      type: boolean
      defaultValue: 'false'
    - variable: waitForClusterPolicy
      label: Gate On ClusterPolicy As Well As GPU Capacity
      description: Off by default. The gpuready gate verifies allocatable GPU capacity, which is the signal that
        actually decides whether a GPU pod can be scheduled. ClusterPolicy aggregates every GPU Operator operand,
        including dcgm-exporter, so gating on it makes the Stack wait on components no downstream task needs.
        Enable it only if you want the Stack to hold until the whole operand set is healthy.
      type: boolean
      defaultValue: 'false'
    - variable: minGPUs
      label: Minimum Allocatable GPUs
      description: How many GPUs the scheduler must advertise before the gpuready gate passes and NVSentinel starts.
      type: number
      required: true
      defaultValue: '1'
    - variable: argoProject
      label: Argo CD Project
      type: string
      defaultValue: default
  # Values the gate publishes, readable from the StackInstance outputs subresource.
  publishedOutputs:
    - name: gpucount
      fromTask:
        task: gpuready
        output: gpucount
    - name: gpupool
      fromTask:
        task: gpuready
        output: gpupool
    - name: dcgmhost
      fromTask:
        task: gpuready
        output: dcgmhost
    - name: dcgmport
      fromTask:
        task: gpuready
        output: dcgmport
  tasks:
    - name: cert-manager
      timeout: 15m0s
      argoCDApplication:
        # A Stack task cannot be skipped: there is no when/if/enabled field, and control
        # flow is only legal inside a scalar. Switching templateRef.name is the sanctioned
        # idiom, so certManagerPreinstalled sends this task to demo-cert-manager-check,
        # which verifies the existing installation instead of installing a second one.
        # Both templates take the same two parameters, so this map serves either one.
        templateRef:
          name: 'demo-cert-manager{{ if eq (.Values.certManagerPreinstalled | toString) "true" }}-check{{ end }}'
        parameters:
          cpuNodePool: '{{ .Values.cpuNodePool }}'
          project: '{{ .Values.argoProject }}'
    - name: gpu-operator
      timeout: 45m0s
      argoCDApplication:
        templateRef:
          name: demo-gpu-operator
        parameters:
          cpuNodePool: '{{ .Values.cpuNodePool }}'
          version: '{{ .Values.gpuOperatorVersion }}'
          project: '{{ .Values.argoProject }}'
          driverPreinstalled: '{{ .Values.driverPreinstalled | toString }}'
    # The GPU Operator Application goes Healthy as soon as its resources are created,
    # which is long before a driver is built and a GPU is schedulable. This task is the
    # real readiness gate: a Job that waits for ClusterPolicy to report ready and for the
    # scheduler to advertise GPUs, then publishes the contract other tasks consume.
    # Argo CD's built-in Job health supplies the Progressing-until-complete behavior, so
    # no argocd-cm customization is involved.
    #
    # The name has no hyphen on purpose: a task that declares outputs is referenced as
    # {{ .Outputs.task.name }}, and the template syntax cannot address a name with "-".
    - name: gpuready
      dependsOn:
        - gpu-operator
      timeout: 45m0s
      argoCDApplication:
        templateRef:
          name: demo-stack-gate
        parameters:
          cpuNodePool: '{{ .Values.cpuNodePool }}'
          project: '{{ .Values.argoProject }}'
          capacityMin: '{{ .Values.minGPUs }}'
          # The gate template is workload-agnostic; the GPU keys belong here, with the
          # Stack that publishes them.
          contractData: |
            gpuPool: gpu-compute
            dcgmHost: nvidia-dcgm.gpu-operator.svc
            dcgmPort: "5555"
          # Off by default. Allocatable GPU capacity is the stronger signal and is checked
          # regardless; ClusterPolicy only adds a wait on operands, such as dcgm-exporter,
          # that nothing downstream depends on.
          waitEnabled: '{{ .Values.waitForClusterPolicy | toString }}'
      outputs:
        - name: gpucount
          fromResource:
            apiVersion: v1
            kind: ConfigMap
            namespace: gpu-stack
            name: gpu-stack-contract
            jsonPath: '{.data.observedCount}'
        - name: gpupool
          fromResource:
            apiVersion: v1
            kind: ConfigMap
            namespace: gpu-stack
            name: gpu-stack-contract
            jsonPath: '{.data.gpuPool}'
        - name: dcgmhost
          fromResource:
            apiVersion: v1
            kind: ConfigMap
            namespace: gpu-stack
            name: gpu-stack-contract
            jsonPath: '{.data.dcgmHost}'
        - name: dcgmport
          fromResource:
            apiVersion: v1
            kind: ConfigMap
            namespace: gpu-stack
            name: gpu-stack-contract
            jsonPath: '{.data.dcgmPort}'
    # NVSentinel dials the standalone DCGM host engine, and the GPU Operator creates
    # dcgm-exporter and nvidia-dcgm at the same instant with nothing ordering them. The
    # exporter loses that race on a cold start and reports GpuDcgmConnectivityFailure.
    # This gate holds nvsentinel until the host engine is actually serving. It publishes
    # no contract and gates on no capacity: it is a wait, nothing else.
    - name: dcgmready
      dependsOn:
        - gpu-operator
      timeout: 15m0s
      argoCDApplication:
        templateRef:
          name: demo-stack-gate
        parameters:
          project: '{{ .Values.argoProject }}'
          cpuNodePool: '{{ .Values.cpuNodePool }}'
          releaseName: dcgm-ready
          waitResource: daemonset/nvidia-dcgm
          waitNamespace: gpu-operator
          waitCondition: 'jsonpath={.status.numberReady}=1'
          watchAPIGroup: apps
          watchResources: daemonsets
          capacityMin: '0'
          contractName: ''
    # Runs alongside nvsentinel: both need only the gate to have passed. The sample
    # occupies one GPU for the few seconds it takes, and proves the GPU computes rather
    # than only that the scheduler advertised it.
    - name: gpu-smoke-test
      dependsOn:
        - gpuready
      timeout: 15m0s
      argoCDApplication:
        templateRef:
          name: demo-gpu-smoke-test
        parameters:
          project: '{{ .Values.argoProject }}'
          gpuPool: '{{ .Outputs.gpuready.gpupool }}'
    - name: nvsentinel
      dependsOn:
        - gpuready
        - dcgmready
        - cert-manager
      timeout: 20m0s
      argoCDApplication:
        templateRef:
          name: demo-nvsentinel
        parameters:
          cpuNodePool: '{{ .Values.cpuNodePool }}'
          version: '{{ .Values.nvsentinelVersion }}'
          project: '{{ .Values.argoProject }}'
          driverPreinstalled: '{{ .Values.driverPreinstalled | toString }}'
          # Read from the contract the gate published rather than hard-coded here.
          dcgmHost: '{{ .Outputs.gpuready.dcgmhost }}'
          dcgmPort: '{{ .Outputs.gpuready.dcgmport }}'
