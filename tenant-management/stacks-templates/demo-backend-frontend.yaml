# The Stack: three tasks of two different types in one dependency graph.
#
#   credentials (app) ──► backend (argoCDApplication) ──► frontend (argoCDApplication)
#        │                      │                              ▲
#        │ token                │ endpoint                     │
#        └──────────────────────┴──────────────────────────────┘
#          frontend reads the token through its transitive path to credentials
#
# Requires the App and the two ArgoCDApplicationTemplate objects in this
# directory, since it references all three by name. A templateRef is resolved on
# every reconcile, so apply them first or the stack reports TemplateNotFound
# until they land.
---
apiVersion: management.loft.sh/v1
kind: StackTemplate
metadata:
  name: demo-backend-frontend
spec:
  displayName: Demo backend and frontend
  description: >-
    A Platform App that generates a shared API token, then two Argo CD
    Applications configured from it and from each other. Mixes task types in a
    single graph and hands captured values down it.
  parameters:
    - variable: repoURL
      label: Git repository URL
      type: string
      required: true
    - variable: targetRevision
      label: Target revision
      type: string
      defaultValue: main
    - variable: backendNamespace
      label: Backend namespace
      type: string
      defaultValue: demo-backend
    - variable: frontendNamespace
      label: Frontend namespace
      type: string
      defaultValue: demo-frontend
    # The chart and the App decide what they name their Service and Secret, so
    # the output sources are parameterized rather than hard-coded.
    - variable: backendServiceName
      label: Backend Service name
      type: string
      defaultValue: backend
    - variable: backendSecretName
      label: Shared API token Secret name
      type: string
      defaultValue: backend-api
    # Gateway API exposure, off by default. Turning it on requires the tenant
    # cluster's vcluster.yaml to carry the sync config in
    # install/virtual-cluster-template.yaml, and a Gateway on the control plane
    # cluster for the route to attach to.
    - variable: exposeThroughGateway
      label: Expose the frontend through a shared Gateway
      type: boolean
      defaultValue: "false"
    - variable: gatewayName
      label: Gateway name, as mirrored into the tenant
      type: string
      defaultValue: shared-gateway
    - variable: gatewayNamespace
      label: Gateway namespace, as mirrored into the tenant
      type: string
      defaultValue: gateway-system
    - variable: hostname
      label: Frontend hostname
      type: string
      defaultValue: ""

  tasks:
    # ---------------------------------------------------------------------
    # Task 1: the shared API token. An `app` task, not an Argo CD one.
    #
    # This is why the graph mixes types. An App's manifests are handed to Helm
    # as written, with cluster access, so it can generate the token with
    # randAlphaNum and keep it stable with lookup. Argo CD renders client-side
    # with no cluster access, so a chart it syncs can do neither and would
    # rotate the token on every sync.
    #
    # An app task requires the stack to have an owner, and pulls in the `apps`
    # license feature alongside `argo-integration`.
    #
    # A task that declares outputs needs a name of letters and digits only,
    # because it is addressed as {{ .Outputs.credentials.<name> }}.
    # ---------------------------------------------------------------------
    # Durations are written in the canonical form the apiserver serializes back
    # (10m0s, not 10m), so a GitOps diff of this file does not show drift.
    - name: credentials
      timeout: 5m0s
      app:
        templateRef:
          name: demo-api-token
        parameters:
          secretName: "{{ .Values.backendSecretName }}"
      outputs:
        # The generated value, read back out of the cluster. fromSecret is the
        # path for sensitive values: it decodes the key and keeps the value out
        # of status and out of publishedOutputs below.
        #
        # An app task may read outputs only from its AppInstance's release
        # namespace, and only once the child reports Deployed.
        - name: token
          fromSecret:
            namespace: "{{ .Values.backendNamespace }}"
            name: "{{ .Values.backendSecretName }}"
            key: token

    # ---------------------------------------------------------------------
    # Task 2: the backend. Consumes the token, produces its own endpoint.
    # ---------------------------------------------------------------------
    - name: backend
      dependsOn:
        - credentials
      timeout: 10m0s
      argoCDApplication:
        templateRef:
          name: demo-backend
        # `parameters` is valid only on the templateRef arm. These values are
        # rendered by the Stack, then handed to the ArgoCDApplicationTemplate.
        # An app task feeding an Argo CD task is the same handoff as any other;
        # the graph does not care that the two ends are different types.
        parameters:
          repoURL: "{{ .Values.repoURL }}"
          targetRevision: "{{ .Values.targetRevision }}"
          namespace: "{{ .Values.backendNamespace }}"
          backendToken: "{{ .Outputs.credentials.token }}"
      outputs:
        # fromResource reads one scalar through a kubectl JSONPath. The cluster
        # assigns this address, so it cannot be known before the task syncs:
        # that is the case where capture is the only option. Cluster-scoped
        # resources and core v1 Secrets are rejected here.
        #
        # An Argo CD task may read from its destination namespace plus every
        # namespace it reports a synced resource in, and only once the child
        # reports Synced.
        - name: endpoint
          fromResource:
            apiVersion: v1
            kind: Service
            namespace: "{{ .Values.backendNamespace }}"
            name: "{{ .Values.backendServiceName }}"
            jsonPath: "{.spec.clusterIP}"

    # ---------------------------------------------------------------------
    # Task 3: the frontend. Configured from both tasks above it.
    #
    # backendToken reads an output of `credentials`, which is not in this task's
    # dependsOn. That is allowed because the path is transitive: frontend ->
    # backend -> credentials. A reference with no path at all is rejected with
    # MissingDependsOn.
    # ---------------------------------------------------------------------
    - name: frontend
      dependsOn:
        - backend
      timeout: 10m0s
      argoCDApplication:
        templateRef:
          name: demo-frontend
        parameters:
          repoURL: "{{ .Values.repoURL }}"
          targetRevision: "{{ .Values.targetRevision }}"
          namespace: "{{ .Values.frontendNamespace }}"
          # The handoff. These render only once both producing tasks are healthy
          # and their values are captured, so the frontend Application is never
          # created carrying a placeholder.
          backendEndpoint: "{{ .Outputs.backend.endpoint }}"
          backendToken: "{{ .Outputs.credentials.token }}"
          httpRouteEnabled: "{{ .Values.exposeThroughGateway }}"
          gatewayName: "{{ .Values.gatewayName }}"
          gatewayNamespace: "{{ .Values.gatewayNamespace }}"
          hostname: "{{ .Values.hostname }}"

  # Captured outputs are internal to the stack unless they are published. The
  # endpoint is safe to hand to users; the token is not published at all.
  publishedOutputs:
    - name: backendEndpoint
      fromTask:
        task: backend
        output: endpoint
