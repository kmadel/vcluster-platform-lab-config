kind: Project
apiVersion: management.loft.sh/v1
metadata:
  name: baremetal-tenants
spec:
  displayName: Bare Metal Tenants
  owner:
    user: admin
  quotas: {}
  allowedClusters:
    - name: loft-cluster
  allowedTemplates:
    - kind: VirtualClusterTemplate
      group: storage.loft.sh
      name: private-nodes-metal3-static
    - kind: VirtualClusterTemplate
      group: storage.loft.sh
      name: private-nodes-metal3-dynamic
    - kind: VirtualClusterTemplate
      group: storage.loft.sh
      name: private-nodes-metal3-static-gpu-stack
  allowedNodeTypes: null
  allowedNodeProfiles: null
  requireTemplate: {}
  requirePreset: {}
  access:
    - name: loft-admin-access
      verbs:
        - get
        - update
        - patch
        - delete
      subresources:
        - '*'
      users:
        - admin
  namespacePattern:
    virtualCluster: p-{{.Values.loft.project}}-v-{{.Values.loft.name}}