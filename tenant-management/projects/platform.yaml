kind: Project
apiVersion: management.loft.sh/v1
metadata:
  name: platform
spec:
  displayName: Platform
  owner:
    user: admin
  quotas: {}
  allowedClusters:
    - name: '*'
  allowedTemplates:
    - kind: VirtualClusterTemplate
      group: storage.loft.sh
      name: '*'
    - kind: SpaceTemplate
      group: storage.loft.sh
      name: '*'
  allowedNodeTypes: null
  allowedNodeProfiles: null
  requireTemplate: {}
  requirePreset: {}
  access:
    - name: loft-admin-access
      verbs:
        - get
        - update
        - patch
        - delete
      subresources:
        - '*'
      users:
        - admin
  namespacePattern:
    virtualCluster: p-{{.Values.loft.project}}-v-{{.Values.loft.name}}