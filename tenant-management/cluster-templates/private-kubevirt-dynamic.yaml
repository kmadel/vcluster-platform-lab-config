apiVersion: management.loft.sh/v1
kind: VirtualClusterTemplate
metadata:
  name: private-nodes-kubevirt-dynamic
spec:
  displayName: Private Nodes — KubeVirt Dynamic AutoNodes
  description: |
    Private node tenant cluster backed by VMs provisioned on demand via the KubeVirte NodeProvider. Nodes are claimed from available local-kvm NodeProvider nodes, written with Ubuntu 24.04, and joined as workers automatically.
  owner:
    team: loft-admins
  template:
    metadata: {}
    instanceTemplate:
      metadata: {}
    pro: {}
    helmRelease:
      chart:
        version: 0.37.2
      values: |
        privateNodes:
          enabled: true
          vpn:
            enabled: true
          autoNodes:
            - provider: kubevirt-us-va-blacksburg-dc1
              dynamic:
                - name: vm-dynamic-node-pool-1
                  nodeTypeSelector:
                    - property: vcluster.com/node-type
                      value: '{{ .Values.nodeType }}'
                  limits:
                    cpu: '{{ .Values.cpuLimit }}'
        networking:
          podCIDR: 10.64.0.0/16
          serviceCIDR: 10.128.0.0/16
        controlPlane:
          backingStore:
            etcd:
              embedded:
                enabled: true
          distro:
            k8s:
              version: "{{ .Values.kubernetesVersion }}"
          statefulSet:
            scheduling:
              nodeSelector:
                kubernetes.io/hostname: vmetal-w02
        integrations:
          argoCD:
            enabled: true
            connector: demo-lab
    accessPoint:
      ingress: {}
    forwardTokenMode: "Off"
    spaceTemplate:
      metadata: {}
  parameters:
    - variable: nodeType
      label: VM Node Type
      description: |
        kvm-small runs on shared hosts and works for every project. kvm-small-reserved
        runs only on bare metal your tenant provisioned for VMs, so it requires a tenant
        project with a reserved host.
      options:
        - kvm-small
        - kvm-small-reserved
      defaultValue: kvm-small
    - variable: kubernetesVersion
      label: Kubernetes Version
      description: |
        Control plane Kubernetes version. Updating this value triggers a rolling upgrade of the vCluster control plane. The bare metal node kubelet is re-provisioned separately via the NodeClaim lifecycle.
      options:
        - v1.34.11
        - v1.35.8
        - v1.36.4
        - v1.37.0
      defaultValue: v1.36.4
    - variable: cpuLimit
      label: CPU Limit
      description: |
        Maximum CPUs that can be provisioned by this node pool.
      options:
        - '1'
        - '2'
        - '4'
        - '6'
        - '8'
      defaultValue: '4'
