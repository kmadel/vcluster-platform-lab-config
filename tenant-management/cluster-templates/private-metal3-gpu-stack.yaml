apiVersion: management.loft.sh/v1
kind: VirtualClusterTemplate
metadata:
  name: private-nodes-metal3-static-gpu-stack
  annotations:
    vcluster.com/template-icon: gpu.svg
  labels:
    demo.vcluster.com/shared: "true"
spec:
  displayName: Private Nodes — Metal3 Static with NVIDIA GPU Stack
  description: Fixed-size Metal3 GPU pool with GPU Operator and NVSentinel delivered by a Stack.
  owner:
    team: loft-admins
  parameters:
    - variable: kubernetesVersion
      label: Kubernetes Version
      description: |
        Control plane Kubernetes version. Updating this value triggers a rolling upgrade of the vCluster control plane while the fixed worker pools remain managed through the NodeClaim lifecycle.
      options:
        - v1.34.11
        - v1.35.8
        - v1.36.4
      defaultValue: v1.36.4
      section: Control Plane
    - variable: cpuNodePool
      label: CPU Service Pool Label
      description: Value of workload.example.com/pool on CPU service workers.
      type: string
      required: true
      defaultValue: cpu-services
      section: Control Plane
    - variable: argoProject
      label: Argo CD Project
      type: string
      defaultValue: default
      section: Argo CD
    - variable: driverPreinstalled
      label: NVIDIA Driver Preinstalled
      type: boolean
      defaultValue: "true"
      section: NVIDIA GPU Operator
    - variable: certManagerPreinstalled
      label: cert-manager Already Installed
      description: Enable when the tenant cluster already runs cert-manager. The Stack then verifies that
        installation instead of installing its own.
      type: boolean
      defaultValue: "false"
      section: NVSentinel
    - variable: minGPUs
      label: Minimum Allocatable GPUs
      description: How many GPUs the scheduler must advertise before the gpuready gate passes.
      type: number
      required: true
      defaultValue: "1"
      section: Control Plane
    - variable: gpuOperatorVersion
      label: GPU Operator Version
      type: string
      defaultValue: v26.3.3
      section: NVIDIA GPU Operator
    - variable: nvsentinelVersion
      label: NVSentinel Chart and Image Version
      type: string
      defaultValue: v1.13.0
      section: NVSentinel
  template:
    pro:
      enabled: true
    helmRelease:
      chart:
        name: vcluster
        repo: https://charts.loft.sh
        version: "0.37.2"
      values: |-
        privateNodes:
          enabled: true
          # Workers reach the control plane through the Platform VPN.
          vpn:
            enabled: true
          autoNodes:
            - provider: metal3-us-va-blacksburg-dc1
              static:
                - name: gpu
                  profile: '{{ if contains "--" .Values.loft.project }}gpu-compute-{{ index (splitList "--" .Values.loft.project) 0 }}{{ else }}gpu-compute{{ end }}'
                  # This lab has one GPU machine available for private nodes.
                  quantity: 0
                  properties:
                    vcluster.com/os-image: ubuntu-noble-nvidia-gpu
                  nodeTypeSelector:
                    - property: vcluster.com/profile
                      operator: In
                      values:
                        - xlarge-gpu
                # A simulated GB300 tray (Metal3 NodeType rack-a-gb300-tray: 4 GPUs from
                # nvml-mock, installed by its cloud-init) carved into 1-GPU VMs
                # (kvm-gb300-1gpu). The NVIDIA device plugin (provider-cluster-mock-gpu-
                # device-plugin.yaml) advertises its 4 nvidia.com/gpu, and each VM requests
                # one, so the scheduler fills the tray like a passthrough host. The GPU each
                # VM reports still comes from nvml-mock inside the VM: no device is passed
                # through. Shares the mock-gpu-host label so every other NodeType avoids it.
                - name: gpu-tray-host
                  profile: '{{ if contains "--" .Values.loft.project }}gpu-compute-{{ index (splitList "--" .Values.loft.project) 0 }}{{ else }}gpu-compute{{ end }}'
                  quantity: 1
                  properties:
                    vcluster.com/os-image: ubuntu-noble-bootstrap
                  nodeLabels:
                    demo.vcluster.com/mock-gpu-host: "true"
                    demo.vcluster.com/mock-gpu-tray: "true"
                    # Lets the NVIDIA device plugin's default affinity accept this node.
                    nvidia.com/gpu.present: "true"
                  nodeTypeSelector:
                    - property: vcluster.com/accelerator
                      value: gb300
                - name: cpu
                  profile: '{{ if contains "--" .Values.loft.project }}cpu-services-{{ index (splitList "--" .Values.loft.project) 0 }}{{ else }}cpu-services{{ end }}'
                  quantity: 1
                  nodeTypeSelector:
                    - property: vcluster.com/profile
                      operator: In
                      values:
                        - medium
              # Inherit OS image, SSH keys, and network configuration from the provider.
          joinNode:
            containerd:
              enabled: true
              registry:
                configPath: /etc/containerd/certs.d
                mirrors:
                  registry.k8s.io:
                    hosts:
                      - server: http://192.168.50.61:5000
                        capabilities: ["pull", "resolve"]
                        skipVerify: true
                  quay.io:
                    hosts:
                      - server: http://192.168.50.61:5001
                        capabilities: ["pull", "resolve"]
                        skipVerify: true
                  nvcr.io:
                    hosts:
                      - server: http://192.168.50.61:5002
                        capabilities: ["pull", "resolve"]
                        skipVerify: true
                  ghcr.io:
                    hosts:
                      - server: http://192.168.50.61:5003
                        capabilities: ["pull", "resolve"]
                        skipVerify: true
                  docker.io:
                    hosts:
                      - server: http://192.168.50.61:5004
                        capabilities: ["pull", "resolve"]
                        skipVerify: true

        controlPlane:
          backingStore:
            etcd:
              embedded:
                enabled: true
          distro:
            k8s:
              version: "{{ .Values.kubernetesVersion }}"
          statefulSet:
            scheduling:
              nodeSelector:
                kubernetes.io/hostname: vmetal-w02

        integrations:
          argoCD:
            enabled: true
            connector: '{{ if contains "--" .Values.loft.project }}demo-lab-{{ index (splitList "--" .Values.loft.project) 0 }}{{ else }}demo-lab{{ end }}'

        deploy:
          cni:
            flannel:
              enabled: true
          stacks:
            - name: gpu
              displayName: Demo - GPU Stack
              templateRef:
                name: demo-gpu
              parameters:
                cpuNodePool: {{ .Values.cpuNodePool | quote }}
                argoProject: {{ .Values.argoProject | quote }}
                driverPreinstalled: {{ .Values.driverPreinstalled | toString | quote }}
                certManagerPreinstalled: {{ .Values.certManagerPreinstalled | toString | quote }}
                minGPUs: {{ .Values.minGPUs | toString | quote }}
                gpuOperatorVersion: {{ .Values.gpuOperatorVersion | quote }}
                nvsentinelVersion: {{ .Values.nvsentinelVersion | quote }}
