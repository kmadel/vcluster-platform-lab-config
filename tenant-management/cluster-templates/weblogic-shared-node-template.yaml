apiVersion: management.loft.sh/v1
kind: VirtualClusterTemplate
metadata:
  name: weblogic-shared-node
  labels:
    app.kubernetes.io/part-of: vcluster-weblogic-demo
    tenancy.loft.sh/model: shared-node
spec:
  displayName: WebLogic Shared-Node Tenant
  description: >-
    Shared-node tenant cluster for WebLogic domains. WebLogic and Gateway API
    resources are reconciled by shared host-side operators, while each client
    receives an isolated Kubernetes API.
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: vcluster-weblogic-demo
        tenancy.loft.sh/model: shared-node
    instanceTemplate:
      metadata:
        labels:
          app.kubernetes.io/part-of: vcluster-weblogic-demo
    spaceTemplate:
      metadata:
        labels:
          # Matches the WebLogic operator install flag:
          # --set "domainNamespaceLabelSelector=weblogic-operator=enabled"
          weblogic-operator: enabled
      objects: |-
        apiVersion: v1
        kind: Secret
        metadata:
          name: ocr-pull-secret
          labels:
            loft.sh/project-secret-name: ocr-pull-secret
        data:
          .dockerconfigjson: e30K
        type: kubernetes.io/dockerconfigjson
    pro:
      enabled: true
    helmRelease:
      chart:
        # Pin this to the vCluster chart version approved for the POC.
        version: 0.36.0
      values: |-
        sync:
          # 5a. Sync the WebLogic CRDs up so the single host operator reconciles them.
          #     Match the versions your operator serves (Domain v9, Cluster v1 on operator 4.x).
          toHost:
            customResources:
              domains.weblogic.oracle:
                enabled: true
              clusters.weblogic.oracle:
                enabled: true
              replicationgroups.elasticache.services.k8s.aws:
                enabled: true
            gatewayApi:
              # Tenants define routes; the shared Gateway itself stays host-owned.
              httpRoutes:
                enabled: true
              referenceGrants:
                enabled: auto

          # 5b. Import the shared Envoy Gateway so tenant HTTPRoutes can attach to it.
          fromHost:
            gatewayClasses:
              enabled: true
              selector:
                matchLabels:
                  vcluster.loft.sh/shared-gateway: "true"
            gateways:
              enabled: true
              mappings:
                byName:
                  "envoy-gateway-system/shared-gw": "envoy-gateway-system/shared-gw"
              allowedRoutes:
                overrides:
                  - hostNamespace: envoy-gateway-system
                    name: shared-gw
                    virtualNamespacePolicy:
                      from: All

        # 5c. Sleep Mode - shared nodes only, pre-production only. Perfect for Dev/QA/Lab/UAT.
        sleepMode:
          enabled: true
          autoSleep:
            afterInactivity: 2h
            schedule: "0 20 * * 1-5"      # also sleep weeknights at 20:00
          autoWakeup:
            schedule: "0 7 * * 1-5"       # wake weekday mornings at 07:00
          timeZone: America/New_York

        integrations:
          argoCD:
            enabled: true
            connector: demo-lab

        deploy:
          argoCD:
            applications:
              - name: weblogic-domain
                displayName: WebLogic Domain and HTTPRoute
                target: vcluster
                template:
                  name: vcluster-weblogic-domain-app
                  parameters:
                    namespace: wi
                    domainUID: wi-domain
                    appHost: "{{ .Values.loft.virtualClusterName }}.demo.vcluster.example"
                    appContextPath: /demo