# Loki datasource and the tenant cluster dashboard for the bundled Grafana,
# whose sidecars load every ConfigMap labelled grafana_dashboard or
# grafana_datasource in vcluster-platform. Applied by
# bootstrap/observability-grafana.yaml.
#
# dashboards/tenant-cluster.json is a copy of the Humana demo's
# (loft-demos/ce-demo-humana, observability/aks/dashboards/); edit it there and
# copy it back so the two don't drift.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - loki-datasource.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: grafana-dashboard-tenant-cluster
    namespace: vcluster-platform
    files:
      - dashboards/tenant-cluster.json
    options:
      labels:
        grafana_dashboard: "1"
  # What a tenant cluster's own team opens from its Observability link in the Platform UI
  # (generated from the same script as tenant-cluster.json, in tenant mode).
  - name: grafana-dashboard-tenant-view
    namespace: vcluster-platform
    files:
      - dashboards/tenant-view.json
    options:
      labels:
        grafana_dashboard: "1"
  # Fleet-wide IPv4 address use, from bootstrap/observability-ipv4.yaml
  # (generated by gen_ipv4.py, like the Humana copy).
  - name: grafana-dashboard-ipv4
    namespace: vcluster-platform
    files:
      - dashboards/ipv4.json
    options:
      labels:
        grafana_dashboard: "1"
