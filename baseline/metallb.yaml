# metallb.yaml - uniform baseline app (the MetalLB controller + speaker).
#
# The controller install is identical everywhere. The per-cluster IP pool is NOT
# here; it lives in metallb-config.yaml, which reads the pool from the Cluster
# annotation. Splitting "uniform install" from "per-cluster config" keeps each
# template readable instead of one template full of conditionals.
apiVersion: management.loft.sh/v1
kind: ArgoCDApplicationTemplate
metadata:
  name: metallb
spec:
  displayName: "MetalLB"
  owner:
    team: loft-admins
  template:
    spec:
      project: default
      source:
        repoURL: https://metallb.github.io/metallb
        chart: metallb
        targetRevision: 0.16.1
        helm:
          # Required, not cosmetic. With no releaseName Argo CD uses the
          # generated Application name (vcluster-platform-metallb-loft-<hash>),
          # and the chart's fullname helper renders a whole second controller and
          # speaker set alongside the live one, both claiming the same IP pool.
          releaseName: metallb
      destination:
        namespace: metallb-system
      ignoreDifferences:
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: bgppeers.metallb.io
          jsonPointers:
            - /spec/conversion/webhook/clientConfig/caBundle
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - RespectIgnoreDifferences=true
