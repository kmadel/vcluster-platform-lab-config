# The shared "lab" Gateway on the hub. Listener map:
#   http / https              *.lab.kurtmadel.com (https carries vcp.lab and
#                             otel.lab)
#   apps-http / apps-https    *.apps.lab.kurtmadel.com (Argo CD, Forgejo)
#   tenant-http / tenant-https *.tenant.lab.kurtmadel.com (tenant cluster routes)
# Argo CD reaches Forgejo through apps-https, so a broken Gateway also breaks
# Argo CD's access to this repo. Never pruned or deleted by Argo CD; recover with
# kubectl apply -f hub/edge/ from a checkout.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: lab
  namespace: envoy-gateway-system
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  gatewayClassName: eg
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: lab-edge
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.lab.kurtmadel.com"
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.lab.kurtmadel.com"
      tls:
        mode: Terminate
        certificateRefs:
          - name: lab-kurtmadel-com-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: apps-http
      protocol: HTTP
      port: 80
      hostname: "*.apps.lab.kurtmadel.com"
      allowedRoutes:
        namespaces:
          from: All
    - name: apps-https
      protocol: HTTPS
      port: 443
      hostname: "*.apps.lab.kurtmadel.com"
      tls:
        mode: Terminate
        certificateRefs:
          - name: apps-lab-kurtmadel-com-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: tenant-http
      protocol: HTTP
      port: 80
      hostname: "*.tenant.lab.kurtmadel.com"
      allowedRoutes:
        namespaces:
          from: All
    - name: tenant-https
      protocol: HTTPS
      port: 443
      hostname: "*.tenant.lab.kurtmadel.com"
      tls:
        mode: Terminate
        certificateRefs:
          - name: tenant-lab-kurtmadel-com-tls
      allowedRoutes:
        namespaces:
          from: All
