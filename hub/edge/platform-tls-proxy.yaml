# nginx that terminates TLS for vcp.lab.kurtmadel.com and forwards to the loft
# Service with Upgrade/Connection preserved, plus CORS for the *.tenant.lab
# snooze page. Known gaps (fix in Git after adoption, not during it):
# - nginx reads the cert only at start; restart after cert-manager renews.
# - client_max_body_size is unset (1 MiB default).
apiVersion: v1
kind: ConfigMap
metadata:
  name: loft-tls-proxy
  namespace: vcluster-platform
data:
  nginx.conf: |
    worker_processes auto;

    events {
      worker_connections 4096;
    }

    http {
      map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
      }

      # Reflect origin only for *.tenant.lab.kurtmadel.com; all others get empty string
      map $http_origin $cors_origin {
        default "";
        "~^https?://[^/]+\.tenant\.lab\.kurtmadel\.com$" $http_origin;
      }

      server {
        # Keep this hop on HTTP/1.1 so Tailscale coordinator WebSocket
        # registration can complete with a 101 Switching Protocols response.
        listen 8443 ssl;
        server_name vcp.lab.kurtmadel.com;

        ssl_certificate     /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location / {
          # CORS preflight — answered here, never forwarded to the backend
          if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
            add_header Access-Control-Max-Age       86400 always;
            add_header Vary                         Origin always;
            return 204;
          }

          add_header Access-Control-Allow-Origin $cors_origin always;
          add_header Vary                        Origin always;

          proxy_pass http://loft.vcluster-platform.svc.cluster.local:80;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto https;
          proxy_buffering off;
          proxy_read_timeout 3600s;
          proxy_send_timeout 3600s;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loft-tls-proxy
  namespace: vcluster-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: loft-tls-proxy
  template:
    metadata:
      labels:
        app: loft-tls-proxy
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: loft-tls-proxy
              topologyKey: kubernetes.io/hostname
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: https
              containerPort: 8443
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: tls
              mountPath: /etc/nginx/tls
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: loft-tls-proxy
        - name: tls
          secret:
            secretName: vcp-lab-kurtmadel-com-tls
---
apiVersion: v1
kind: Service
metadata:
  name: loft-tls-proxy
  namespace: vcluster-platform
spec:
  selector:
    app: loft-tls-proxy
  ports:
    - name: https
      port: 443
      targetPort: https
