# vCluster Platform ingress on the hub.
#
# Port 80 only redirects. Port 443 is TLS passthrough to the nginx proxy
# (platform-tls-proxy.yaml), because Envoy Gateway's default upgrade allowlist
# is websocket-only and rejects the Tailscale coordinator upgrade
# (POST /coordinator/ts2021, Upgrade: tailscale-control-protocol) that private
# nodes need. See kpi-vcluster/manifests/envoy/README.md for the Envoy-native
# replacement (Option A).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vcluster-platform
  namespace: vcluster-platform
spec:
  parentRefs:
    - name: lab
      namespace: envoy-gateway-system
      sectionName: http
  hostnames:
    - vcp.lab.kurtmadel.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: vcluster-platform
  namespace: vcluster-platform
spec:
  parentRefs:
    - name: lab
      namespace: envoy-gateway-system
      sectionName: vcp-tls
  hostnames:
    - vcp.lab.kurtmadel.com
  rules:
    - backendRefs:
        - name: loft-tls-proxy
          port: 443
