# vCluster Platform ingress on the hub (Option A, see README.md).
#
# Port 80 only redirects. Port 443 terminates on the shared "https" listener
# (the *.lab wildcard cert covers vcp.lab) and routes straight to the loft
# Service. The private-node Tailscale upgrade is allowed by
# platform-upgrades.yaml; CORS for the *.tenant.lab snooze page comes from
# platform-cors.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vcluster-platform
  namespace: vcluster-platform
spec:
  parentRefs:
    - name: lab
      namespace: envoy-gateway-system
      sectionName: http
  hostnames:
    - vcp.lab.kurtmadel.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vcluster-platform-https
  namespace: vcluster-platform
spec:
  parentRefs:
    - name: lab
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - vcp.lab.kurtmadel.com
  rules:
    - backendRefs:
        - name: loft
          port: 80
      timeouts:
        # Envoy's default route timeout is 15s. Watches, log follows, and the
        # Tailscale map poll are long-lived streams.
        request: 0s
